<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Baruc's League - FPL Side Pot Tracker</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0e0318">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --surface-color: #0e0318;       /* Deeper obsidian-purple background */
            --card-bg: #1c092d;             /* Rich plum card container */
            --card-border: rgba(255, 255, 255, 0.09); /* Subtle glass edge */
            --primary-color: #00ff87;        /* FPL Green - RESERVED FOR KEY STATS */
            --accent-color: #00f5ff;         /* Cyan accent for secondary elements */
            --ice-blue: #80d4ff;             /* Ice blue for cold/low stats */
            --text-color: #ffffff;           /* Clean white headers & names */
            --text-muted: #bdaecf;          /* High-legibility lavender subtext */
            --border-subtle: rgba(255, 255, 255, 0.06);
            --danger-color: #ff4b4b;        /* Crisp red for hits & low ranks */
            --gold-color: #ffc72c;          /* Refined gold for winners & 1st place */
            --silver-color: #d1d5db;        /* Metallic silver for runner-up prizes */
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--surface-color);
            background-image:
                linear-gradient(180deg, rgba(7, 4, 18, 0.12) 0%, rgba(14, 3, 24, 0.22) 52%, rgba(7, 4, 18, 0.38) 100%),
                url('page-bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 24px 14px;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 4px 0;
            text-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }

        .update-timestamp {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        /* Splash Screen Styling */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--surface-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease-out;
        }

        #splash-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* App Container */
        #app {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Glassmorphic Cards */
        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.15) 100%), var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px 14px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }

        /* Section Headings */
        .section-title {
            color: var(--text-color);
            text-align: center;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0 0 14px 0;
            opacity: 0.9;
        }

        /* GW Cards & Dropdowns */
        .fut-card {
            position: relative;
            cursor: pointer;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.15) 100%), var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            user-select: none;
        }
        
        .fut-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .fut-card.glow-gold {
            border: 1.5px solid var(--gold-color) !important;
            box-shadow: 0 0 16px rgba(255, 199, 44, 0.25), inset 0 0 12px rgba(255, 199, 44, 0.1);
        }

        .chip-badge {
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 4px;
            margin-left: 8px;
            text-transform: uppercase;
            background: var(--gold-color);
            color: #12041f;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .card-dropdown {
            margin-top: 12px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 10px;
            font-size: 0.85rem;
            display: none;
        }

        .fut-card.expanded .card-dropdown {
            display: block;
        }

        /* Standings Chip Inventory Pills */
        .chip-inventory {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
            width: 100%;
        }
        
        .chip-pill {
            font-size: 0.58rem;
            font-weight: 700;
            padding: 3px 0;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            text-align: center;
            box-sizing: border-box;
            flex: 1;
            min-width: 0;
            line-height: 1.1;
        }
        
        .chip-pill.active {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background: rgba(0, 255, 135, 0.15);
            box-shadow: 0 0 6px rgba(0, 255, 135, 0.3);
        }
        
        .chip-pill.used {
            color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.03);
            background: transparent;
            text-decoration: line-through;
            opacity: 0.5;
        }

        /* Carousel Component Styling */
        .carousel-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 16px;
            padding-bottom: 8px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-card {
            min-width: 100%;
            box-sizing: border-box;
            scroll-snap-align: start;
        }

        /* GW Carousel Header Controls */
        .gw-carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 2px;
        }
        .carousel-nav-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .carousel-nav-btn:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }
        .carousel-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        /* Badges */
        .badge-live {
            background: rgba(0, 255, 135, 0.13);
            color: var(--primary-color);
            border: 1px solid rgba(0, 255, 135, 0.38);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .badge-live::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        .badge-final {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .dot.active {
            width: 18px;
            border-radius: 4px;
            background-color: var(--primary-color);
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-weight: 500;
        }

        /* FUT-inspired Gameweek Experience */
        .gw-carousel-header {
            position: relative;
            top: auto;
            z-index: 1;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(14, 3, 24, 0.92);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(14px);
        }

        .gw-title-stack {
            min-width: 110px;
            text-align: center;
        }

        .gw-title {
            color: #fff;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .gw-status {
            min-height: 22px;
            margin-top: 4px;
            display: flex;
            justify-content: center;
        }

        .gw-progress {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            min-height: 12px;
            margin: -4px 0 12px;
        }

        .gw-progress-dot {
            width: 6px;
            height: 6px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.38);
            cursor: pointer;
            transition: width 0.2s ease, background 0.2s ease, opacity 0.2s ease;
        }

        .gw-progress-dot.active {
            width: 20px;
            border-radius: 5px;
            background: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.3);
        }

        .gw-progress-dot.is-hidden {
            display: none;
        }

        .manager-item {
            --item-accent: rgba(255, 255, 255, 0.13);
            position: relative;
            overflow: visible;
            z-index: 1;
            border-color: var(--item-accent);
            border-width: 2px;
            padding: 12px 14px;
            margin-bottom: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            outline: none;
            background-color: #160b1f;
            background:
                linear-gradient(115deg, rgba(255,255,255,0.035), transparent 30%),
                linear-gradient(145deg, #22122d, #160b1f);
        }

        .manager-item:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 3px;
        }

        .manager-glow-wrap {
            position: relative;
            isolation: isolate;
            margin-bottom: 8px;
        }

        .manager-item * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .manager-item::selection,
        .manager-item *::selection {
            background: transparent;
        }

        .manager-item::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            opacity: 0.2;
            background-image:
                linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.16) 49%, transparent 57%),
                repeating-linear-gradient(135deg, transparent 0 18px, rgba(255,255,255,0.035) 18px 19px);
        }

        .manager-item.rank-card-1 {
            --item-accent: rgba(255, 199, 44, 0.5);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(255, 199, 44, 0.08), 0 0 26px rgba(255, 199, 44, 0.14), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-item.rank-card-2 {
            --item-accent: rgba(209, 213, 219, 0.38);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(209, 213, 219, 0.06), 0 0 24px rgba(209, 213, 219, 0.09), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-item.rank-card-3 {
            --item-accent: rgba(201, 130, 69, 0.42);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(201, 130, 69, 0.06), 0 0 24px rgba(201, 130, 69, 0.1), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-item.rank-card-4 {
            --item-accent: rgba(184, 91, 160, 0.28);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(184, 91, 160, 0.05), 0 0 22px rgba(184, 91, 160, 0.08), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-glow-wrap.transfer-positive::before,
        .manager-glow-wrap.transfer-negative::before {
            content: '';
            display: block;
            position: absolute;
            top: 27%;
            right: -12px;
            bottom: 27%;
            left: -12px;
            z-index: 0;
            pointer-events: none;
            filter: blur(10px);
        }

        .manager-glow-wrap.transfer-positive::before {
            background: linear-gradient(90deg, rgba(20, 255, 118, 0.34) 0, transparent 13%, transparent 87%, rgba(20, 255, 118, 0.34) 100%);
        }

        .manager-glow-wrap.transfer-negative::before {
            background: linear-gradient(90deg, rgba(255, 24, 48, 0.38) 0, transparent 13%, transparent 87%, rgba(255, 24, 48, 0.38) 100%);
        }

        .manager-item.glow-gold {
            box-shadow: 0 0 22px rgba(255, 199, 44, 0.28), inset 0 0 20px rgba(255, 199, 44, 0.08);
        }

        .manager-summary {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
        }

        .manager-rank {
            width: 38px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid color-mix(in srgb, var(--item-accent) 72%, transparent);
            background: rgba(0, 0, 0, 0.24);
            clip-path: polygon(18% 0, 100% 0, 100% 82%, 82% 100%, 0 100%, 0 18%);
            color: var(--item-accent);
            font-size: 1.3rem;
            font-weight: 900;
        }

        .manager-name {
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
        }

        .manager-team {
            color: var(--text-muted);
            font-size: 0.72rem;
            margin-top: 2px;
        }

        .manager-overall {
            color: var(--text-muted);
            font-size: 0.66rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .rank-up { color: var(--primary-color); }
        .rank-down { color: var(--danger-color); }
        .rank-level { color: var(--text-muted); }

        .manager-score {
            text-align: right;
        }

        .compact-overall {
            margin-top: 7px;
            color: #fff;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.03em;
        }

        .score-metrics {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .score-metric + .score-metric {
            padding-left: 12px;
            border-left: 1px solid rgba(255, 255, 255, 0.12);
        }

        .average-value {
            color: var(--text-muted);
        }

        .manager-score-value {
            color: #fff;
            font-size: 1.35rem;
            font-weight: 900;
            line-height: 1;
        }

        .manager-score-label {
            color: var(--text-muted);
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-top: 5px;
        }

        .players-left {
            margin-top: 4px;
            color: var(--accent-color);
            font-size: 0.58rem;
            font-weight: 850;
            white-space: nowrap;
        }

        .chip-slot {
            display: inline-flex;
            align-items: center;
            min-height: 18px;
            margin-top: 5px;
            padding: 2px 7px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.16);
            font-size: 0.56rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .chip-slot.active {
            color: var(--gold-color);
            border-color: rgba(255, 199, 44, 0.38);
            background: rgba(255, 199, 44, 0.08);
        }

        .form-row {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 9px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .form-label {
            color: var(--text-muted);
            font-size: 0.62rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            margin-right: 3px;
        }

        .form-position {
            width: 23px;
            height: 23px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.22);
            font-size: 0.68rem;
            font-weight: 900;
        }

        .form-position.form-rank-1 { color: #171006; background: var(--gold-color); border-color: var(--gold-color); }
        .form-position.form-rank-2 { color: #17191d; background: var(--silver-color); border-color: var(--silver-color); }
        .form-position.form-rank-3 { color: #1d0f08; background: #c98245; border-color: #c98245; }
        .form-position.form-rank-4 { color: #fff; background: #7b2639; border-color: #a93d55; }

        .form-average {
            margin-left: 5px;
            padding-left: 10px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 0.6rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .form-average strong {
            color: #fff;
            font-size: 0.72rem;
        }

        .expand-hint {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 700;
        }

        .manager-item.expanded .expand-hint-icon {
            display: inline-block;
            transform: rotate(180deg);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .detail-tile {
            min-width: 0;
            padding: 10px 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 0.56rem;
            font-weight: 900;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        .detail-name {
            overflow-wrap: anywhere;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            margin-top: 5px;
        }

        .detail-value {
            color: var(--primary-color);
            font-size: 0.65rem;
            font-weight: 800;
            margin-top: 3px;
        }

        .detail-tile.worst .detail-value { color: var(--danger-color); }
        .detail-tile.transfer .detail-value { color: var(--accent-color); }

        .detail-list {
            display: grid;
            gap: 0;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 82px minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 9px 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .detail-row:last-child {
            border-bottom: 0;
        }

        .detail-row-label {
            color: var(--text-muted);
            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .detail-row-name {
            min-width: 0;
            overflow-wrap: anywhere;
            color: #fff;
            font-size: 0.74rem;
            font-weight: 750;
        }

        .detail-row-points {
            color: var(--accent-color);
            font-size: 0.68rem;
            font-weight: 900;
            white-space: nowrap;
        }

        .transfer-result {
            display: block;
            margin-top: 3px;
            font-size: 0.6rem;
        }

        .transfer-result.positive { color: var(--primary-color); }
        .transfer-result.negative { color: var(--danger-color); }
        .transfer-result.level { color: var(--text-muted); }

        @media (max-width: 430px) {
            .support-panel table th:nth-child(2), .support-panel table td:nth-child(2) { padding-right: 8px !important; }
            .support-panel table th:nth-child(3), .support-panel table td:nth-child(3) { padding-left: 8px !important; }
        }

        .detail-row.worst .detail-row-points { color: var(--danger-color); }
        .detail-row.star .detail-row-points { color: var(--gold-color); }

        .support-panel {
            position: relative;
            overflow: hidden;
            border-color: rgba(255, 255, 255, 0.1);
            background:
                linear-gradient(115deg, rgba(255,255,255,0.04), transparent 31%),
                linear-gradient(145deg, rgba(34, 18, 45, 0.98), rgba(22, 11, 31, 0.99));
            box-shadow: 0 0 24px rgba(118, 62, 155, 0.08), 0 10px 26px rgba(0, 0, 0, 0.24);
        }

        .support-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.15;
            background-image:
                linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.14) 49%, transparent 57%),
                repeating-linear-gradient(135deg, transparent 0 20px, rgba(255,255,255,0.028) 20px 21px);
        }

        .support-panel > * {
            position: relative;
            z-index: 1;
        }

        .tracker-shell {
            padding: 16px 14px 14px;
            margin-bottom: 18px;
        }

        .tracker-shell .gw-carousel-header,
        .gw-shell .gw-carousel-header {
            padding: 6px 0 10px;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            backdrop-filter: none;
        }

        .tracker-shell .section-title {
            margin-bottom: 8px;
        }

        .tracker-shell .carousel-container {
            margin-bottom: 0 !important;
        }

        .gw-shell {
            margin-bottom: 18px;
        }

        .gw-shell .carousel-container {
            margin-bottom: 0 !important;
        }

        .gw-shell #gw-carousel-track .carousel-card {
            padding: 0 6px;
        }

        .period-slide-card {
            margin-bottom: 0;
            background: rgba(0, 0, 0, 0.12);
            box-shadow: none;
        }

        .transfer-line {
            display: block;
        }

        .manager-item .card-dropdown {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-rows: 0fr;
            margin-top: 0;
            padding-top: 0;
            overflow: hidden;
            border-top-color: transparent;
            opacity: 0;
            transition: grid-template-rows 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease,
                margin-top 0.32s ease, padding-top 0.32s ease;
        }

        .manager-item.expanded .card-dropdown {
            grid-template-rows: 1fr;
            margin-top: 12px;
            padding-top: 10px;
            border-top-color: var(--border-subtle);
            opacity: 1;
        }

        .manager-item .card-dropdown > .detail-list {
            min-height: 0;
            overflow: hidden;
        }

        .period-carousel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .period-carousel-header.single-period .carousel-nav-btn {
            visibility: hidden;
            pointer-events: none;
        }

        @media (min-width: 700px) {
            body {
                background-size: 920px auto;
                background-position: center 35%;
            }
        }

        .period-carousel-title {
            color: #fff;
            font-size: 0.9rem;
            font-weight: 800;
            text-align: center;
        }

        @media (max-width: 430px) {
            body { padding: 14px 10px; }
            h1 { font-size: 1.35rem; margin-bottom: 12px; }
            .manager-item { padding: 9px 12px; margin-bottom: 0; }
            .manager-glow-wrap { margin-bottom: 7px; }
            .manager-name { font-size: 0.92rem; }
            .manager-team { font-size: 0.67rem; }
            .chip-slot { min-height: 17px; margin-top: 4px; padding: 1px 6px; }
            .form-row { margin-top: 7px; padding-top: 7px; }
            .form-position { width: 21px; height: 21px; }
            .detail-grid { grid-template-columns: 1fr; }
            .manager-summary { grid-template-columns: 1fr auto; gap: 8px; }
            .manager-score-value { font-size: 1.15rem; }
            .carousel-nav-btn { padding: 6px 10px; }
            .score-metrics { gap: 8px; }
            .score-metric + .score-metric { padding-left: 8px; }
            .detail-row { grid-template-columns: 74px minmax(0, 1fr) auto; gap: 7px; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen Overlay -->
    <div id="splash-screen">
        <img src="splash-bg.png" alt="Loading" onerror="this.parentElement.style.display='none'">
    </div>

    <h1>Baruc's League</h1>

    <div id="app">
        <div class="loading-text">Loading tracker data...</div>
    </div>

    <div id="timestamp" class="update-timestamp" style="margin-top: 20px; margin-bottom: 0;"></div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVQrIeCr5DL5HRBBH13eycceCb7l8VD0X3YnX3ZB0v321OBMAsSLCw5fgChvTQl8Emaw/exec';

        const TEAM_NAMES = {
            "Nathan": "nr xi",
            "Mike": "mikes marauders",
            "Carl": "Ginger Ninjas",
            "Charlie": "Oakley1"
        };

        let currentGwSlideIdx = 0;
        let totalGwSlides = 0;
        let gwDataStore = [];
        let currentPeriodSlideIdx = 0;
        let totalPeriodSlides = 0;

        function hideSplash() {
            const splash = document.getElementById('splash-screen');
            if (splash && !splash.classList.contains('fade-out')) {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 400);
            }
        }

        function getChipDisplayName(chipKey) {
            if (!chipKey) return '';
            const s = String(chipKey).toLowerCase();
            if (s.includes('wildcard') || s === 'wc') return 'WILDCARD';
            if (s.includes('free') || s === 'fh') return 'FREE HIT';
            if (s.includes('bboost') || s.includes('bench') || s === 'bb') return 'BENCH BOOST';
            if (s.includes('3c') || s.includes('3xc') || s.includes('triple') || s === 'tc') return 'TRIPLE CAPTAIN';
            return chipKey.toUpperCase();
        }

        function renderChipsHtml(chipsData, activeChip) {
            const standardChips = [
                { id: 'wc', label: 'WC' },
                { id: 'fh', label: 'FH' },
                { id: 'bb', label: 'BB' },
                { id: 'tc', label: 'TC' }
            ];

            const normalize = (name) => {
                if (!name) return '';
                const s = String(name).toLowerCase();
                if (s.includes('wildcard') || s === 'wc') return 'wc';
                if (s.includes('free') || s === 'fh') return 'fh';
                if (s.includes('bboost') || s.includes('bench') || s === 'bb') return 'bb';
                if (s.includes('3c') || s.includes('3xc') || s.includes('triple') || s === 'tc') return 'tc';
                return s;
            };

            const activeNorm = normalize(activeChip);

            const statusMap = {};
            if (chipsData && typeof chipsData === 'object') {
                Object.keys(chipsData).forEach(k => {
                    const normKey = normalize(k);
                    const val = chipsData[k];
                    if (val === false || val === 'used') statusMap[normKey] = 'used';
                    else if (val === true || val === 'available') statusMap[normKey] = 'available';
                });
            }

            return `<div class="chip-inventory">` + standardChips.map(chip => {
                let state = 'available';

                if (activeNorm === chip.id) {
                    state = 'active';
                } else if (statusMap[chip.id] === 'used') {
                    state = 'used';
                }

                return `<span class="chip-pill ${state}">${chip.label}</span>`;
            }).join('') + `</div>`;
        }

        function formatTransfers(rawText, hits) {
            if (!rawText || rawText === 'None') {
                return hits && hits > 0 ? `(-${hits} pts hit)` : 'None';
            }
            const ins = [];
            const outs = [];
            const inMatches = rawText.match(/In:\s*([^,\/]+)/gi);
            const outMatches = rawText.match(/Out:\s*([^,\/]+)/gi);
            
            if (inMatches) {
                inMatches.forEach(m => {
                    const name = m.replace(/In:\s*/i, '').trim();
                    if (name && !ins.includes(name)) ins.push(name);
                });
            }
            if (outMatches) {
                outMatches.forEach(m => {
                    const name = m.replace(/Out:\s*/i, '').trim();
                    if (name && !outs.includes(name)) outs.push(name);
                });
            }
            
            if (ins.length === 0 && outs.length === 0) {
                let res = String(rawText);
                if (hits && hits > 0 && !res.includes('pt')) res += ` (-${hits} pts)`;
                return res;
            }
            
            let resultParts = [];
            if (ins.length > 0) resultParts.push(`In: ${ins.join(', ')}`);
            if (outs.length > 0) resultParts.push(`Out: ${outs.join(', ')}`);
            
            let finalStr = resultParts.join(' | ');
            if (hits && hits > 0 && !finalStr.includes('pt')) {
                finalStr += ` (-${hits} pts)`;
            }
            return finalStr;
        }

        function getManagerKey(manager) {
            return String(manager.managerName || manager.name || '').trim().toLowerCase();
        }

        function getManagerPoints(manager) {
            return Number(manager.netPoints !== undefined ? manager.netPoints : manager.livePoints) || 0;
        }

        function rankKeysByScore(keys, scoreMap) {
            const sorted = [...keys].sort((a, b) => {
                const scoreDiff = (scoreMap[b] || 0) - (scoreMap[a] || 0);
                return scoreDiff || a.localeCompare(b);
            });

            const ranks = {};
            let previousScore = null;
            let previousRank = 0;
            sorted.forEach((key, index) => {
                const score = scoreMap[key] || 0;
                const rank = previousScore !== null && score === previousScore ? previousRank : index + 1;
                ranks[key] = rank;
                previousScore = score;
                previousRank = rank;
            });
            return ranks;
        }

        function decorateGameweekData(gameweeks) {
            const cumulative = {};
            const previousOverallRanks = {};
            const formHistory = {};
            const pointsHistory = {};

            gameweeks.forEach((gameweek, gwIndex) => {
                const standings = Array.isArray(gameweek.standings) ? gameweek.standings : [];
                const managerKeys = standings.map(getManagerKey).filter(Boolean);
                const weeklyScores = {};

                standings.forEach(manager => {
                    const key = getManagerKey(manager);
                    if (!key) return;
                    const points = getManagerPoints(manager);
                    weeklyScores[key] = points;
                    cumulative[key] = (cumulative[key] || 0) + points;
                    if (!formHistory[key]) formHistory[key] = [];
                    if (!pointsHistory[key]) pointsHistory[key] = [];
                });

                const weeklyRanks = rankKeysByScore(managerKeys, weeklyScores);
                const overallRanks = rankKeysByScore(Object.keys(cumulative), cumulative);

                standings.forEach(manager => {
                    const key = getManagerKey(manager);
                    if (!key) return;

                    formHistory[key].push(weeklyRanks[key]);
                    pointsHistory[key].push(getManagerPoints(manager));
                    const recentForm = formHistory[key].slice(-5);
                    const recentPoints = pointsHistory[key].slice(-5);
                    const paddedForm = Array(Math.max(0, 5 - recentForm.length)).fill(null).concat(recentForm);
                    const previousRank = previousOverallRanks[key];
                    const currentRank = overallRanks[key];

                    manager.uiMeta = {
                        weeklyRank: weeklyRanks[key],
                        overallRank: currentRank,
                        rankMovement: gwIndex === 0 || previousRank === undefined ? 0 : previousRank - currentRank,
                        form: paddedForm,
                        fiveGwAverage: recentPoints.length
                            ? recentPoints.reduce((sum, value) => sum + value, 0) / recentPoints.length
                            : 0
                    };
                });

                Object.keys(overallRanks).forEach(key => {
                    previousOverallRanks[key] = overallRanks[key];
                });
            });
        }

        async function loadTrackerData() {
            const safetyTimer = setTimeout(() => {
                hideSplash();
            }, 5000);

            try {
                const separator = SCRIPT_URL.includes('?') ? '&' : '?';
                const response = await fetch(`${SCRIPT_URL}${separator}_=${Date.now()}`, {
                    cache: 'no-store'
                });
                if (!response.ok) {
                    throw new Error(`Tracker request failed with HTTP ${response.status}`);
                }
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                clearTimeout(safetyTimer);
                if (data.updated) {
                    document.getElementById('timestamp').innerText = `Updated: ${data.updated}`;
                }
                renderApp(data);
            } catch (error) {
                clearTimeout(safetyTimer);
                console.error('Error fetching data:', error);
                document.getElementById('app').innerHTML = `
                    <div class="card">
                        <p style="color: var(--danger-color); text-align: center; font-weight: 500;">Unable to load data. Please check your connection or Apps Script deployment.</p>
                    </div>`;
            } finally {
                hideSplash();
            }
        }

        function toggleManagerCard(card) {
            const isExpanded = card.classList.toggle('expanded');
            card.setAttribute('aria-expanded', String(isExpanded));
        }

        function handleManagerCardKey(event, card) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                toggleManagerCard(card);
            }
        }

        function renderApp(data) {
            const appDiv = document.getElementById('app');
            let html = '';
            totalPeriodSlides = 0;

            // 1. Gameweek Tracker Carousel Parsing with Deduplication
            gwDataStore = [];
            let rawGwStore = [];
            if (data.gameweeks && Array.isArray(data.gameweeks) && data.gameweeks.length > 0) {
                rawGwStore = data.gameweeks;
            } else {
                const legacyStandings = data.standings || (data.liveData ? data.liveData.standings : []);
                const legacyGw = data.gameweek || (data.liveData ? data.liveData.gameweek : 1);
                if (legacyStandings.length > 0) {
                    rawGwStore = [{
                        gameweek: legacyGw,
                        isLive: true,
                        standings: legacyStandings
                    }];
                }
            }

            // Deduplicate gameweeks by GW number to prevent duplicates
            const seenGws = new Set();
            rawGwStore.forEach(gw => {
                const gwNum = gw.gameweek !== undefined ? Number(gw.gameweek) : (gw.gw !== undefined ? Number(gw.gw) : null);
                if (gwNum !== null) {
                    if (!seenGws.has(gwNum)) {
                        seenGws.add(gwNum);
                        gwDataStore.push(gw);
                    }
                } else {
                    gwDataStore.push(gw);
                }
            });
            gwDataStore.sort((a, b) => (Number(a.gameweek || a.gw || 0)) - (Number(b.gameweek || b.gw || 0)));
            decorateGameweekData(gwDataStore);

            if (gwDataStore.length > 0) {
                totalGwSlides = gwDataStore.length;
                html += `<div class="gw-shell">`;
                
                html += `
                    <div class="gw-carousel-header">
                        <button id="prevGwBtn" class="carousel-nav-btn" onclick="moveGwSlide(-1)" aria-label="Previous gameweek">‹ Prev</button>
                        <div class="gw-title-stack">
                            <div id="gwSlideTitle" class="gw-title"></div>
                            <div id="gwSlideStatus" class="gw-status"></div>
                        </div>
                        <button id="nextGwBtn" class="carousel-nav-btn" onclick="moveGwSlide(1)" aria-label="Next gameweek">Next ›</button>
                    </div>

                    <div class="gw-progress" id="gw-progress">
                        ${gwDataStore.map((_, index) => `<button class="gw-progress-dot" data-gw-index="${index}" onclick="goToGwSlide(${index})" aria-label="Go to gameweek ${index + 1}"></button>`).join('')}
                    </div>

                    <div class="carousel-container" id="gw-carousel-track" style="margin-bottom: 24px;">
                `;

                gwDataStore.forEach((gwGroup, gwIdx) => {
                    const standings = gwGroup.standings || [];
                    standings.sort((a, b) => {
                        const pA = a.netPoints !== undefined ? a.netPoints : (a.livePoints !== undefined ? a.livePoints : 0);
                        const pB = b.netPoints !== undefined ? b.netPoints : (b.livePoints !== undefined ? b.livePoints : 0);
                        return pB - pA;
                    });

                    html += `<div class="carousel-card" id="gw-slide-${gwIdx}">`;

                    standings.forEach(mgr => {
                        const managerName = mgr.managerName || mgr.name || '';
                        const teamName = mgr.teamName || TEAM_NAMES[managerName] || '';
                        const hasActiveChip = mgr.activeChip !== null && mgr.activeChip !== undefined && mgr.activeChip !== '' && mgr.activeChip !== 'None';
                        const chipLabel = getChipDisplayName(mgr.activeChip || mgr.chipDisplay);

                        // Robustly resolve Star Performer data
                        const getPerformer = (m, keys) => {
                            for (let k of keys) {
                                if (m[k] !== undefined && m[k] !== null && m[k] !== '' && m[k] !== 'None') {
                                    return m[k];
                                }
                            }
                            return null;
                        };

                        const starObj = getPerformer(mgr, ['starPerformer', 'star', 'star_name', 'bestPerformer']);
                        const worstObj = getPerformer(mgr, ['worstPerformer', 'worst', 'worst_name', 'worstPlayer']);

                        const starName = starObj ? (typeof starObj === 'object' ? (starObj.name || starObj.player || starObj.playerName || 'None') : starObj) : null;
                        const starPts = starObj && typeof starObj === 'object' ? (starObj.points !== undefined ? starObj.points : (starObj.pts !== undefined ? starObj.pts : 0)) : 0;
                        
                        const worstName = worstObj ? (typeof worstObj === 'object' ? (worstObj.name || worstObj.player || worstObj.playerName || 'None') : worstObj) : null;
                        const worstPts = worstObj && typeof worstObj === 'object' ? (worstObj.points !== undefined ? worstObj.points : (worstObj.pts !== undefined ? worstObj.pts : 0)) : 0;

                        const rawPoints = mgr.netPoints !== undefined ? mgr.netPoints : (mgr.livePoints !== undefined ? mgr.livePoints : 0);
                        const hasNoEntry = Boolean(gwGroup.isLive) && Number(rawPoints) === 0 && !starName && !worstName;
                        const pointsDisplay = hasNoEntry ? '–' : rawPoints;

                        let rawTransfers = 'None';
                        if (mgr.transfersText && mgr.transfersText !== 'None') {
                            rawTransfers = String(mgr.transfersText);
                        } else if (mgr.transfers) {
                            if (Array.isArray(mgr.transfers)) {
                                rawTransfers = mgr.transfers.length > 0 ? mgr.transfers.join(', ') : 'None';
                            } else if (typeof mgr.transfers === 'object') {
                                rawTransfers = Object.values(mgr.transfers).join(', ');
                            } else {
                                rawTransfers = String(mgr.transfers);
                            }
                        } else if (mgr.transfersMade !== undefined && mgr.transfersMade !== null) {
                            const hitCost = mgr.transferCost || mgr.event_transfers_cost || mgr.hitCost || mgr.hits;
                            const hitStr = hitCost ? ` (-${hitCost} pts)` : '';
                            rawTransfers = `${mgr.transfersMade} made${hitStr}`;
                        } else if (mgr.event_transfers !== undefined) {
                            rawTransfers = `${mgr.event_transfers} made`;
                        }

                        let transfersText = formatTransfers(rawTransfers, mgr.hits);
                        const transfersHtml = String(transfersText)
                            .split(/\s*\|\s*/)
                            .map(part => `<span class="transfer-line">${part}</span>`)
                            .join('');

                        const meta = mgr.uiMeta || { weeklyRank: 4, overallRank: 4, rankMovement: 0, form: [null, null, null, null, null], fiveGwAverage: 0 };
                        const rankClass = `rank-card-${Math.min(meta.weeklyRank || 4, 4)}`;
                        const transferEffect = Number(mgr.transferEffectiveness);
                        const hitClass = mgr.transferEffectiveness !== null && mgr.transferEffectiveness !== undefined
                            ? (transferEffect >= 1 ? 'transfer-positive' : (transferEffect <= -1 ? 'transfer-negative' : ''))
                            : '';
                        const hasTransferResult = mgr.transferEffectiveness !== null && mgr.transferEffectiveness !== undefined;
                        const transferResultClass = transferEffect > 0 ? 'positive' : (transferEffect < 0 ? 'negative' : 'level');
                        const transferResultText = hasTransferResult
                            ? `<span class="transfer-result ${transferResultClass}">Result ${transferEffect > 0 ? '+' : ''}${transferEffect} pts</span>`
                            : '';
                        const playersLeft = mgr.playersLeft !== null && mgr.playersLeft !== undefined ? Number(mgr.playersLeft) : null;
                        const playersLeftHtml = Boolean(gwGroup.isLive) && playersLeft !== null && !hasNoEntry
                            ? `<div class="players-left">${playersLeft} ${playersLeft === 1 ? 'player' : 'players'} left</div>`
                            : '';
                        const movementClass = meta.rankMovement > 0 ? 'rank-up' : (meta.rankMovement < 0 ? 'rank-down' : 'rank-level');
                        const movementIcon = meta.rankMovement > 0 ? `▲ ${meta.rankMovement}` : (meta.rankMovement < 0 ? `▼ ${Math.abs(meta.rankMovement)}` : '—');
                        const formHtml = (meta.form || []).map(position => {
                            const cls = position ? `form-rank-${Math.min(position, 4)}` : '';
                            return `<span class="form-position ${cls}">${position || '–'}</span>`;
                        }).join('');
                        const averageDisplay = Number(meta.fiveGwAverage || 0).toFixed(1);
                        const cardClass = `fut-card manager-item ${rankClass} ${hasActiveChip ? 'glow-gold' : ''}`;

                        html += `
                            <div class="manager-glow-wrap ${hitClass}">
                              <div class="${cardClass}" role="button" tabindex="0" aria-expanded="false" aria-label="Show details for ${managerName}" onclick="toggleManagerCard(this)" onkeydown="handleManagerCardKey(event, this)">
                                <div class="manager-summary">
                                    <div>
                                        <span class="manager-name">${managerName}</span>
                                        <div class="manager-team">${teamName}</div>
                                        <div class="chip-slot ${hasActiveChip ? 'active' : ''}">${hasActiveChip ? `${chipLabel} ACTIVE` : 'No active chip'}</div>
                                    </div>
                                    <div class="manager-score">
                                        <div class="manager-score-value">${pointsDisplay}</div>
                                        <div class="manager-score-label">GW PTS</div>
                                        ${playersLeftHtml}
                                        <div class="compact-overall">#${meta.overallRank || '–'} <span class="${movementClass}">${movementIcon}</span></div>
                                    </div>
                                </div>

                                <div class="form-row">
                                    <span class="form-label">FORM</span>
                                    ${formHtml}
                                    <span class="form-average">5GW AVG <strong>${averageDisplay}</strong></span>
                                    <span class="expand-hint"><span class="expand-hint-icon">⌄</span></span>
                                </div>
                                
                                <div class="card-dropdown">
                                    <div class="detail-list">
                                        <div class="detail-row star">
                                            <div class="detail-row-label">⭐ Star</div>
                                            <div class="detail-row-name">${starName || 'None'}</div>
                                            <div class="detail-row-points">${starPts} pts</div>
                                        </div>
                                        <div class="detail-row worst">
                                            <div class="detail-row-label">💩 Worst</div>
                                            <div class="detail-row-name">${worstName || 'None'}</div>
                                            <div class="detail-row-points">${worstPts} pts</div>
                                        </div>
                                        <div class="detail-row transfer">
                                            <div class="detail-row-label">🔄 Transfers</div>
                                            <div class="detail-row-name">${transfersHtml}</div>
                                            <div class="detail-row-points">${Number(mgr.hits) > 0 ? `-${Number(mgr.hits)} pts` : 'No hit'}</div>
                                        </div>
                                    </div>
                                </div>
                              </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                });

                html += `</div></div>`;
            }

            // 2. Manager of the Month Carousel
            if (data.monthly && data.monthly.length > 0) {
                const activePeriods = data.monthly.filter(period => {
                    if (!period.scores || period.scores.length === 0) return false;
                    if (period.title.toLowerCase().includes('period period') || period.title.toLowerCase().includes('monthly side pot')) return false;
                    
                    const hasStarted = period.scores.some(s => Number(s.score) > 0);
                    if (!hasStarted) return false;

                    const isMalformed = period.scores.every(s => String(s.score) === s.name);
                    return !isMalformed;
                });

                if (activePeriods.length > 0) {
                    totalPeriodSlides = activePeriods.length;
                    html += `<div class="card support-panel tracker-shell"><div class="section-title">Manager of the Month</div>`;

                    html += `
                        <div class="period-carousel-header ${activePeriods.length === 1 ? 'single-period' : ''}">
                            <button id="prevPeriodBtn" class="carousel-nav-btn" onclick="movePeriodSlide(-1)" aria-label="Previous Manager of the Month period">‹ Prev</button>
                            <div id="periodSlideTitle" class="period-carousel-title"></div>
                            <button id="nextPeriodBtn" class="carousel-nav-btn" onclick="movePeriodSlide(1)" aria-label="Next Manager of the Month period">Next ›</button>
                        </div>
                        <div class="gw-progress" id="period-progress">
                            ${activePeriods.map((_, index) => `<button class="gw-progress-dot" data-period-index="${index}" onclick="goToPeriodSlide(${index})" aria-label="Go to Manager of the Month period ${index + 1}"></button>`).join('')}
                        </div>
                    `;

                    html += `<div class="carousel-container" id="period-carousel">`;
                    
                    activePeriods.forEach((period, periodIndex) => {
                        let cleanTitle = period.title.replace(/^Period\s+\d+\s*\(([^)]+)\)/i, '$1');

                        const formatPrize = (p) => {
                            if (!p) return '£0';
                            let str = String(p).trim();
                            return str.startsWith('£') ? str : '£' + str;
                        };

                        html += `
                            <div class="card carousel-card period-slide-card" id="period-slide-${periodIndex}" data-period-title="${cleanTitle}">
                                <ul style="list-style: none; padding: 0; margin: 0 0 14px 0;">
                                    ${period.scores.map((s, idx, arr) => {
                                        let scoreDisplay = String(s.score !== undefined && s.score !== null ? s.score : '0');
                                        if (idx === arr.length - 1 && !scoreDisplay.includes('💩')) {
                                            scoreDisplay += ' 💩';
                                        }
                                        const teamName = TEAM_NAMES[s.name] || '';
                                        return `
                                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border-subtle);">
                                                <div>
                                                    <div style="font-weight: 600; font-size: 0.9rem; color: #ffffff;">${s.name}</div>
                                                    ${teamName ? `<div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 1px;">${teamName}</div>` : ''}
                                                </div>
                                                <span style="font-weight: 700; font-size: 1rem; color: var(--primary-color);">${scoreDisplay}</span>
                                            </li>
                                        `;
                                    }).join('')}
                                </ul>
                                <div style="font-size: 0.82rem; color: var(--text-muted); background: rgba(0,0,0,0.25); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-subtle);">
                                    <div style="margin-bottom: 4px;">🏆 <strong style="color: #fff;">Winner:</strong> ${period.topScorer || 'TBD'} <span style="color: var(--gold-color); font-weight: 700;">(${formatPrize(period.winnerPrize)})</span></div>
                                    <div>🥈 <strong style="color: #fff;">Runner-up:</strong> ${period.runnerName || 'TBD'} <span style="color: var(--silver-color); font-weight: 700;">(${formatPrize(period.runnerPrize)})</span></div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                }
            }

            // 3. Overall Standings Table
            let topWeeksWonPlayer = null;
            let maxWeeksWon = -1;

            if (data.overall && data.overall.rows && data.overall.rows.length > 0) {
                const headers = data.overall.headers || [];
                const getCol = (name, fallback) => {
                    const idx = headers.findIndex(h => h && h.toString().toLowerCase().includes(name));
                    return idx !== -1 ? idx : fallback;
                };

                const playerIdx = getCol('player', getCol('name', 0));
                const pointsIdx = getCol('point', getCol('total', 1));
                const medalIdx = getCol('medal', 2);
                const weeksWonIdx = getCol('won', getCol('week', 3));
                const prizeIdx = getCol('prize', 5);

                const totalRows = data.overall.rows.length;

                const chipMap = {};
                const activeChipMap = {};

                const latestStandings = gwDataStore.length > 0 ? gwDataStore[gwDataStore.length - 1].standings : [];
                if (latestStandings) {
                    latestStandings.forEach(m => {
                        const key = (m.managerName || m.name || '').trim().toLowerCase();
                        chipMap[key] = m.remainingChips;
                        activeChipMap[key] = m.activeChip;
                    });
                }

                data.overall.rows.forEach(row => {
                    const pName = row[playerIdx];
                    const wWon = Number(row[weeksWonIdx]) || 0;
                    if (wWon > maxWeeksWon) {
                        maxWeeksWon = wWon;
                        topWeeksWonPlayer = { player: pName, val: wWon };
                    }
                });

                html += `
                    <div class="card support-panel" style="margin-top: 24px;">
                        <div class="section-title" style="margin-bottom: 16px;">Overall Standings</div>
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; table-layout: fixed; border-collapse: collapse; text-align: left;">
                                <thead>
                                    <tr style="border-bottom: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px;">
                                        <th style="width: 27%; padding: 0 2px 10px 2px; font-weight: 700;">Manager</th>
                                        <th style="width: 36%; padding: 0 2px 10px 2px; font-weight: 700; text-align: center;">Chips</th>
                                        <th style="width: 21%; padding: 0 2px 10px 2px; font-weight: 700; text-align: center;">Points</th>
                                        <th style="width: 16%; padding: 0 2px 10px 2px; font-weight: 700; text-align: right;">Prize</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.overall.rows.map((row, rIdx) => {
                                        const playerName = row[playerIdx] || '';
                                        const points = row[pointsIdx] !== undefined ? row[pointsIdx] : '';
                                        let medal = medalIdx !== -1 && row[medalIdx] !== undefined ? row[medalIdx] : '';
                                        if (!medal) {
                                            if (rIdx === 0) medal = '🥇';
                                            else if (rIdx === 1) medal = '🥈';
                                            else if (rIdx === 2) medal = '🥉';
                                        }
                                        if (rIdx === totalRows - 1 && !String(medal).includes('💩')) {
                                            medal += ' 💩';
                                        }
                                        const prizeVal = row[prizeIdx] !== undefined ? row[prizeIdx] : 0;
                                        const numericPrize = parseFloat(String(prizeVal).replace(/[^0-9.]/g, '')) || 0;
                                        const prizeStr = String(prizeVal).startsWith('£') ? prizeVal : '£' + prizeVal;
                                        
                                        let prizeColor = 'var(--gold-color)';
                                        if (rIdx === 1) {
                                            prizeColor = 'var(--silver-color)';
                                        }

                                        const prizeHtml = numericPrize > 0 
                                            ? `<span style="color: ${prizeColor}; font-weight: 700;">${prizeStr}</span>` 
                                            : `<span style="color: rgba(255,255,255,0.25); font-weight: 500;">£0</span>`;

                                        const pKey = String(playerName).trim().toLowerCase();
                                        const chipsHtml = renderChipsHtml(chipMap[pKey], activeChipMap[pKey]);

                                        return `
                                            <tr style="border-bottom: 1px solid var(--border-subtle);">
                                                <td style="width: 27%; padding: 12px 2px; font-weight: 600; color: #ffffff; font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                                    ${playerName}
                                                </td>
                                                <td style="width: 36%; padding: 12px 2px; text-align: center;">
                                                    ${chipsHtml}
                                                </td>
                                                <td style="width: 21%; padding: 12px 2px; font-weight: 800; color: var(--primary-color); font-size: 0.92rem; text-align: center; white-space: nowrap;">
                                                    ${points} ${medal}
                                                </td>
                                                <td style="width: 16%; padding: 12px 2px; font-size: 0.85rem; text-align: right; white-space: nowrap;">
                                                    ${prizeHtml}
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            // 4. Transfer Market season totals
            if (Array.isArray(data.transferMarket) && data.transferMarket.length > 0) {
                const signed = value => `${Number(value) > 0 ? '+' : ''}${Number(value) || 0}`;
                const netColour = value => Number(value) > 0 ? 'var(--primary-color)' : (Number(value) < 0 ? 'var(--danger-color)' : 'var(--text-muted)');
                html += `<div class="card support-panel" style="margin-top:24px;"><div class="section-title" style="margin-bottom:16px;">Transfer Market</div><div style="overflow-x:auto;"><table style="width:100%;table-layout:fixed;border-collapse:collapse;"><thead><tr style="border-bottom:1px solid var(--border-subtle);color:var(--text-muted);font-size:.62rem;text-transform:uppercase;letter-spacing:.7px;"><th style="width:34%;padding:0 2px 10px;text-align:left;">Manager</th><th style="width:18%;padding:0 2px 10px;text-align:center;">Transfers</th><th style="width:14%;padding:0 2px 10px;text-align:center;">Hits</th><th style="width:16%;padding:0 2px 10px;text-align:center;">Points</th><th style="width:18%;padding:0 2px 10px;text-align:right;">Net</th></tr></thead><tbody>${data.transferMarket.map(row => `<tr style="border-bottom:1px solid var(--border-subtle);font-size:.78rem;"><td style="padding:11px 2px;color:#fff;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${row.managerName}</td><td style="padding:11px 2px;text-align:center;">${Number(row.transfers)||0}</td><td style="padding:11px 2px;text-align:center;color:${Number(row.hits)>0?'var(--danger-color)':'var(--text-muted)'};">${Number(row.hits)>0?'-'+Number(row.hits):'0'}</td><td style="padding:11px 2px;text-align:center;">${signed(row.points)}</td><td style="padding:11px 2px;text-align:right;font-weight:900;color:${netColour(row.net)};">${signed(row.net)}</td></tr>`).join('')}</tbody></table></div></div>`;
            }

            // 5. Dynamic Calculation for Most Weeks Lost (Fallback)
            let computedWeeksLostPlayer = null;
            if (data.monthly && data.monthly.length > 0) {
                const bottomCounts = {};
                let maxLostCount = 0;

                data.monthly.forEach(period => {
                    if (period.scores && period.scores.length > 0) {
                        const validScores = period.scores.filter(s => s.score !== undefined && s.score !== null && !isNaN(Number(s.score)) && Number(s.score) > 0);
                        if (validScores.length > 0) {
                            let minScore = Math.min(...validScores.map(s => Number(s.score)));
                            validScores.forEach(s => {
                                if (Number(s.score) === minScore) {
                                    bottomCounts[s.name] = (bottomCounts[s.name] || 0) + 1;
                                    if (bottomCounts[s.name] > maxLostCount) {
                                        maxLostCount = bottomCounts[s.name];
                                    }
                                }
                            });
                        }
                    }
                });

                if (maxLostCount > 0) {
                    const tiedPlayers = Object.keys(bottomCounts).filter(p => bottomCounts[p] === maxLostCount);
                    computedWeeksLostPlayer = {
                        player: tiedPlayers.join(' / '),
                        val: maxLostCount
                    };
                }
            }

            // 5. Accolades Card
            if (data.accolades || topWeeksWonPlayer || computedWeeksLostPlayer) {
                const acc = data.accolades || {};

                const getAccObj = (keys) => {
                    for (let k of keys) {
                        if (acc[k] && (acc[k].player || acc[k].val !== undefined || acc[k].value !== undefined)) {
                            return acc[k];
                        }
                    }
                    return null;
                };

                const highestScore = getAccObj(['highestScore']);
                const lowestScore = getAccObj(['lowestScore']);
                const mostWeeksWon = getAccObj(['mostWeeksWon', 'weeksWon']) || topWeeksWonPlayer;
                const mostWeeksLost = getAccObj(['mostWeeksLost', 'mostWeeksLast', 'weeksLost']) || computedWeeksLostPlayer;
                const mostTransfers = getAccObj(['mostTransfers', 'highestTotalTransfers', 'transfers']);
                const highestTransferCost = getAccObj(['highestTotalHit', 'biggestHit', 'highestTransferCost']);

                const formatSub = (item) => {
                    if (!item || !item.player) return 'N/A';
                    return item.player + (item.gw ? ` (${item.gw})` : '');
                };

                const formatVal = (item, type) => {
                    if (!item) return '0';
                    const val = item.val !== undefined ? item.val : (item.value !== undefined ? item.value : item);
                    if (val === undefined || val === null || val === '') return '0';
                    if (type === 'cost') {
                        const num = Number(val);
                        return num > 0 ? '-' + num : String(num);
                    }
                    return String(val);
                };

                const transferMarketSub = (() => {
                    if (!highestTransferCost || !highestTransferCost.player || highestTransferCost.player === 'N/A') return 'N/A';
                    const values = Array.isArray(highestTransferCost.netByPlayer) ? highestTransferCost.netByPlayer : [];
                    if (values.length === 0) return formatSub(highestTransferCost);
                    return values.map(item => {
                        const net = Number(item.val) || 0;
                        const colour = net > 0 ? 'var(--primary-color)' : (net < 0 ? 'var(--danger-color)' : 'var(--text-muted)');
                        return `<span style="color:${colour};">${item.player} ${net > 0 ? '+' : ''}${net} net</span>`;
                    }).join(' · ');
                })();

                html += `
                    <div class="card support-panel" style="margin-top: 24px;">
                        <div class="section-title" style="margin-bottom: 16px;">Accolades</div>
                        <ul style="list-style: none; padding: 0; margin: 0;">
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.88rem; color: #ffffff;">🔥 Highest GW Score</div>
                                    <div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${formatSub(highestScore)}</div>
                                </div>
                                <span style="font-weight: 800; font-size: 1rem; color: var(--primary-color);">${formatVal(highestScore)}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.88rem; color: #ffffff;">🧊 Lowest GW Score</div>
                                    <div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${formatSub(lowestScore)}</div>
                                </div>
                                <span style="font-weight: 800; font-size: 1rem; color: var(--ice-blue);">${formatVal(lowestScore)}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.88rem; color: #ffffff;">🏆 Most Weeks Won</div>
                                    <div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${formatSub(mostWeeksWon)}</div>
                                </div>
                                <span style="font-weight: 800; font-size: 1rem; color: var(--gold-color);">${formatVal(mostWeeksWon)}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.88rem; color: #ffffff;">💩 Most Weeks Lost</div>
                                    <div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${formatSub(mostWeeksLost)}</div>
                                </div>
                                <span style="font-weight: 800; font-size: 1rem; color: var(--danger-color);">${formatVal(mostWeeksLost)}</span>
                            </li>
                        </ul>
                    </div>
                `;
            }

            appDiv.innerHTML = html;

            document.querySelectorAll('.support-panel table:has(th:nth-child(5)) tbody tr').forEach(row => {
                const pointsCell = row.cells[3];
                if (!pointsCell) return;
                const value = Number(pointsCell.textContent.trim()) || 0;
                pointsCell.style.color = value > 0
                    ? 'var(--primary-color)'
                    : (value < 0 ? 'var(--danger-color)' : 'var(--text-muted)');
            });

            if (totalGwSlides > 0) {
                initGwCarousel();
            }

            if (totalPeriodSlides > 0) {
                initPeriodCarousel();
            }
        }

        function initGwCarousel() {
            const track = document.getElementById('gw-carousel-track');
            if (!track) return;

            currentGwSlideIdx = totalGwSlides - 1;
            scrollGwCarousel(false);

            track.addEventListener('scroll', () => {
                const slides = Array.from(track.querySelectorAll('.carousel-card'));
                if (slides.length === 0) return;

                const firstOffset = slides[0].offsetLeft;
                let index = 0;
                let closestDistance = Infinity;

                slides.forEach((slide, slideIndex) => {
                    const slidePosition = slide.offsetLeft - firstOffset;
                    const distance = Math.abs(track.scrollLeft - slidePosition);
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        index = slideIndex;
                    }
                });

                if (index !== currentGwSlideIdx && index >= 0 && index < totalGwSlides) {
                    currentGwSlideIdx = index;
                    updateGwCarouselHeader();
                }
            });
        }

        function updateGwCarouselHeader() {
            const prevBtn = document.getElementById('prevGwBtn');
            const nextBtn = document.getElementById('nextGwBtn');
            const titleEl = document.getElementById('gwSlideTitle');
            const statusEl = document.getElementById('gwSlideStatus');
            const dots = document.querySelectorAll('#gw-progress .gw-progress-dot');

            if (prevBtn) prevBtn.disabled = (currentGwSlideIdx === 0);
            if (nextBtn) nextBtn.disabled = (currentGwSlideIdx === totalGwSlides - 1);

            if (titleEl && gwDataStore[currentGwSlideIdx]) {
                const gwInfo = gwDataStore[currentGwSlideIdx];
                const gwNum = gwInfo.gameweek !== undefined ? gwInfo.gameweek : (gwInfo.gw !== undefined ? gwInfo.gw : (currentGwSlideIdx + 1));
                const badge = gwInfo.isLive 
                    ? `<span class="badge-live">LIVE</span>` 
                    : `<span class="badge-final">FINAL</span>`;
                titleEl.textContent = `GW ${gwNum}`;
                if (statusEl) statusEl.innerHTML = badge;
            }

            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentGwSlideIdx);
                dot.classList.toggle('is-hidden', Math.abs(index - currentGwSlideIdx) > 3);
            });
        }

        function scrollGwCarousel(smooth = true) {
            const track = document.getElementById('gw-carousel-track');
            const slide = document.getElementById(`gw-slide-${currentGwSlideIdx}`);
            if (track && slide) {
                const firstSlide = track.querySelector('.carousel-card');
                const firstOffset = firstSlide ? firstSlide.offsetLeft : 0;
                track.scrollTo({
                    left: slide.offsetLeft - firstOffset,
                    behavior: smooth ? 'smooth' : 'auto'
                });
            }
            updateGwCarouselHeader();
        }

        function moveGwSlide(direction) {
            const nextIdx = currentGwSlideIdx + direction;
            if (nextIdx >= 0 && nextIdx < totalGwSlides) {
                currentGwSlideIdx = nextIdx;
                scrollGwCarousel(true);
            }
        }

        function goToGwSlide(index) {
            if (index >= 0 && index < totalGwSlides) {
                currentGwSlideIdx = index;
                scrollGwCarousel(true);
            }
        }

        function initPeriodCarousel() {
            const track = document.getElementById('period-carousel');
            if (!track) return;

            currentPeriodSlideIdx = totalPeriodSlides - 1;
            scrollPeriodCarousel(false);

            track.addEventListener('scroll', () => {
                const slides = Array.from(track.querySelectorAll('.carousel-card'));
                if (slides.length === 0) return;
                const firstOffset = slides[0].offsetLeft;
                let index = 0;
                let closestDistance = Infinity;

                slides.forEach((slide, slideIndex) => {
                    const distance = Math.abs(track.scrollLeft - (slide.offsetLeft - firstOffset));
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        index = slideIndex;
                    }
                });

                if (index !== currentPeriodSlideIdx) {
                    currentPeriodSlideIdx = index;
                    updatePeriodCarouselHeader();
                }
            });
        }

        function updatePeriodCarouselHeader() {
            const prevBtn = document.getElementById('prevPeriodBtn');
            const nextBtn = document.getElementById('nextPeriodBtn');
            const titleEl = document.getElementById('periodSlideTitle');
            const slide = document.getElementById(`period-slide-${currentPeriodSlideIdx}`);
            const dots = document.querySelectorAll('#period-progress .gw-progress-dot');

            if (prevBtn) prevBtn.disabled = currentPeriodSlideIdx === 0;
            if (nextBtn) nextBtn.disabled = currentPeriodSlideIdx === totalPeriodSlides - 1;
            if (titleEl && slide) titleEl.textContent = slide.dataset.periodTitle || `Period ${currentPeriodSlideIdx + 1}`;

            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentPeriodSlideIdx);
                dot.classList.toggle('is-hidden', Math.abs(index - currentPeriodSlideIdx) > 3);
            });
        }

        function scrollPeriodCarousel(smooth = true) {
            const track = document.getElementById('period-carousel');
            const slide = document.getElementById(`period-slide-${currentPeriodSlideIdx}`);
            if (track && slide) {
                const firstSlide = track.querySelector('.carousel-card');
                const firstOffset = firstSlide ? firstSlide.offsetLeft : 0;
                track.scrollTo({
                    left: slide.offsetLeft - firstOffset,
                    behavior: smooth ? 'smooth' : 'auto'
                });
            }
            updatePeriodCarouselHeader();
        }

        function movePeriodSlide(direction) {
            const nextIdx = currentPeriodSlideIdx + direction;
            if (nextIdx >= 0 && nextIdx < totalPeriodSlides) {
                currentPeriodSlideIdx = nextIdx;
                scrollPeriodCarousel(true);
            }
        }

        function goToPeriodSlide(index) {
            if (index >= 0 && index < totalPeriodSlides) {
                currentPeriodSlideIdx = index;
                scrollPeriodCarousel(true);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTrackerData();
            window.setInterval(() => {
                if (!document.hidden) loadTrackerData();
            }, 120000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) loadTrackerData();
            });
        });
    </script>
