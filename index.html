<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baruc's League - FPL Side Pot Tracker</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#190df5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --surface-color: #1a0524;
            --card-bg: #2b083b;
            --primary-color: #00ff87;
            --accent-color: #02efff;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #4a155f;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--surface-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 16px;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            text-shadow: 0 2px 8px rgba(0,255,135,0.2);
        }

        /* Splash Screen Styling */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--surface-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease-out;
        }

        #splash-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
            margin-bottom: 0;
            animation: none;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* App Container */
        #app {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* Section Headings */
        .section-title {
            color: var(--primary-color);
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 0 0 12px 0;
        }

        /* Carousel Styling */
        .carousel-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 16px;
            padding-bottom: 8px;
            scrollbar-width: none; /* Firefox */
        }
        .carousel-container::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }
        .carousel-card {
            min-width: 100%;
            box-sizing: border-box;
            scroll-snap-align: start;
        }

        /* Carousel Indicator Dots */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--border-color);
            transition: all 0.3s ease;
        }
        .dot.active {
            width: 20px;
            border-radius: 4px;
            background-color: var(--primary-color);
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="splash-bg.png" alt="Loading">
    </div>

    <h1>Baruc's League</h1>
    
    <div id="app">
        <div class="loading-text">Loading tracker data...</div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbznzAi5EmRvb6uHfp898c4T0eGxWGDWu16AccyUfsXqU7M4e5az-Hwp9szBP1W_J97MPg/exec';

        // Hardcoded team name mapping based on setup data
        const TEAM_NAMES = {
            "Nathan": "nr xi",
            "Mike": "mikes marauders",
            "Carl": "Ginger Ninjas",
            "Charlie": "Oakley1"
        };

        function hideSplash() {
            const splash = document.getElementById('splash-screen');
            if (splash && !splash.classList.contains('fade-out')) {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 400);
            }
        }

        async function loadTrackerData() {
            // FORCE HIDE SPLASH IMMEDIATELY FOR DEBUGGING
            hideSplash();
            
            const safetyTimer = setTimeout(() => {
                hideSplash();
            }, 5000);

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                clearTimeout(safetyTimer);
                renderApp(data);
            } catch (error) {
                clearTimeout(safetyTimer);
                console.error('Error fetching data:', error);
                document.getElementById('app').innerHTML = `
                    <div class="card">
                        <p style="color: #ff4b4b; text-align: center; font-weight: 500;">Unable to load data. Please check your connection or Apps Script URL.</p>
                    </div>`;
            } finally {
                hideSplash();
            }
        }

                    if (period.title.toLowerCase().includes('period period') || period.title.toLowerCase().includes('monthly side pot')) return false;
                    const isMalformed = period.scores.every(s => String(s.score) === s.name);
                    return !isMalformed;
                });

                    html += `<div class="section-title">Manager of the Month</div>`;

                        html += `<div class="dot ${isActive}" data-index="${index}"></div>`;
                    });
