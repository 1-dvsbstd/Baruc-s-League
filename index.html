            .detail-row { grid-template-columns: 74px minmax(0, 1fr) auto; gap: 7px; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen Overlay -->
    <div id="splash-screen">
        <img src="splash-bg.png" alt="Loading" onerror="this.parentElement.style.display='none'">
    </div>

    <h1>Baruc's League</h1>

    <div id="data-status-notice" class="data-status-notice" role="status" aria-live="polite"></div>

    <div id="app">
        <div class="loading-text">Loading tracker data...</div>
    </div>

    <div id="timestamp" class="update-timestamp" style="margin-top: 20px; margin-bottom: 0;"></div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVQrIeCr5DL5HRBBH13eycceCb7l8VD0X3YnX3ZB0v321OBMAsSLCw5fgChvTQl8Emaw/exec';
        const TRACKER_CACHE_KEY = 'barucsLeagueLastGoodDataV1';
        let hasRenderedTrackerData = false;

        function readLastGoodTrackerData() {
            try {
                const cached = JSON.parse(localStorage.getItem(TRACKER_CACHE_KEY) || 'null');
                return cached && cached.data ? cached : null;
            } catch (error) {
                return null;
            }
        }

        function saveLastGoodTrackerData(data) {
            try {
                localStorage.setItem(TRACKER_CACHE_KEY, JSON.stringify({
                    savedAt: Date.now(),
                    data: data
                }));
            } catch (error) {
                console.log('Last-known-good tracker storage unavailable.');
            }
        }

        function getHighestPayloadGameweek(data) {
            return Math.max(0, ...((data && data.gameweeks) || []).map(gameweek =>
                Number(gameweek.gameweek !== undefined ? gameweek.gameweek : gameweek.gw) || 0
            ));
        }

        function isUsableTrackerPayload(data, cachedData) {
            if (!data || data.error) return false;
            const hasOverall = Boolean(data.overall && Array.isArray(data.overall.rows) && data.overall.rows.length > 0);
            const hasGameweek = Boolean(Array.isArray(data.gameweeks) && data.gameweeks.some(gameweek =>
                Array.isArray(gameweek.standings) && gameweek.standings.length > 0
            ));
            if (!hasOverall || !hasGameweek) return false;

            // During FPL maintenance the API can return HTTP 200 while the
            // backend silently falls back to GW1 with an empty live map.
            if (cachedData && getHighestPayloadGameweek(data) < getHighestPayloadGameweek(cachedData)) {
                return false;
            }
            return true;
        }

        function showSavedDataNotice(savedAt) {
            const notice = document.getElementById('data-status-notice');
            if (!notice) return;
            const savedTime = savedAt ? new Date(savedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'earlier';
            notice.textContent = `FPL is updating — showing the last available scores from ${savedTime}.`;
            notice.classList.add('visible');
        }

        function clearSavedDataNotice() {
            const notice = document.getElementById('data-status-notice');
            if (!notice) return;
            notice.textContent = '';
            notice.classList.remove('visible');
        }
        
        /*
         * Anonymous background device tracking.
         * No names, IP addresses or personal details are stored.
         */
        function getAnonymousVisitorId() {
            const storageKey = 'barucsLeagueVisitorId';

            try {
                let visitorId = localStorage.getItem(storageKey);

                if (!visitorId) {
                    if (
                        window.crypto &&
                        typeof window.crypto.randomUUID === 'function'
                    ) {
                        visitorId = window.crypto.randomUUID();
                    } else {
                        visitorId =
                            'device_' +
                            Date.now().toString(36) +
                            '_' +
                            Math.random()
                                .toString(36)
                                .substring(2, 15);
                    }

                    localStorage.setItem(storageKey, visitorId);
                }

                return visitorId;
            } catch (error) {
                /*
                 * Storage may be unavailable in some private browsers.
                 */
                return (
                    'temporary_' +
                    Date.now().toString(36) +
                    '_' +
                    Math.random()
                        .toString(36)
                        .substring(2, 15)
                );
            }
        }

        function getAnonymousDeviceLabel() {
            const userAgent = navigator.userAgent || '';
            let platform = 'Unknown device';

            if (/iPad/i.test(userAgent)) {
                platform = 'iPad';
            } else if (/iPhone|iPod/i.test(userAgent)) {
                platform = 'iPhone';
            } else if (/Android/i.test(userAgent)) {
                platform = 'Android';
            } else if (/Windows/i.test(userAgent)) {
                platform = 'Windows PC';
            } else if (/Macintosh|Mac OS X/i.test(userAgent)) {
                platform = 'Mac';
            } else if (/Linux/i.test(userAgent)) {
                platform = 'Linux';
            }

            const installed =
                window.matchMedia(
                    '(display-mode: standalone)'
                ).matches ||
                window.navigator.standalone === true;

            return (
                platform +
                (installed ? ' - Installed app' : ' - Browser')
            );
        }

        function trackAnonymousWebsiteVisit() {
            try {
                const trackingUrl = new URL(SCRIPT_URL);

                trackingUrl.searchParams.set(
                    'action',
                    'trackVisit'
                );

                trackingUrl.searchParams.set(
                    'deviceId',
                    getAnonymousVisitorId()
                );

                trackingUrl.searchParams.set(
                    'device',
                    getAnonymousDeviceLabel()
                );

                trackingUrl.searchParams.set(
                    '_',
                    Date.now().toString()
                );

                fetch(trackingUrl.toString(), {
                    method: 'GET',
                    mode: 'no-cors',
                    cache: 'no-store',
                    keepalive: true
                }).catch(function (error) {
                    console.log(
                        'Background visit tracking unavailable.'
                    );
                });
            } catch (error) {
                console.log(
                    'Background visit tracking unavailable.'
                );
            }
        }

        trackAnonymousWebsiteVisit();
        const TEAM_NAMES = {
            "Nathan": "nr xi",
            "Mike": "mikes marauders",
            "Carl": "Ginger Ninjas",
            "Charlie": "Oakley1"
        };

        let currentGwSlideIdx = 0;
        let totalGwSlides = 0;
        let gwDataStore = [];
        let gwCarouselInitialized = false;
        let gwButtonScrollActive = false;
        let gwButtonScrollTimer = null;
        let gwButtonScrollToken = 0;
        let currentPeriodSlideIdx = 0;
        let totalPeriodSlides = 0;
        let currentProfileSlideIdx = 0;
        let totalProfileSlides = 0;
        let periodCarouselInitialized = false;
        let profileCarouselInitialized = false;
        let periodLoopActive = false;
        let profileLoopActive = false;

        function hideSplash() {
            const splash = document.getElementById('splash-screen');
            if (splash && !splash.classList.contains('fade-out')) {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 400);
            }
        }

        function getChipDisplayName(chipKey) {
            if (!chipKey) return '';
            const s = String(chipKey).toLowerCase();
            if (s.includes('wildcard') || s === 'wc') return 'WILDCARD';
            if (s.includes('free') || s === 'fh') return 'FREE HIT';
            if (s.includes('bboost') || s.includes('bench') || s === 'bb') return 'BENCH BOOST';
            if (s.includes('3c') || s.includes('3xc') || s.includes('triple') || s === 'tc') return 'TRIPLE CAPTAIN';
            return chipKey.toUpperCase();
        }

        function renderChipsHtml(chipsData, activeChip) {
            const standardChips = [
                { id: 'wc', label: 'WC' },
                { id: 'fh', label: 'FH' },
                { id: 'bb', label: 'BB' },
                { id: 'tc', label: 'TC' }
            ];

            const normalize = (name) => {
                if (!name) return '';
                const s = String(name).toLowerCase();
                if (s.includes('wildcard') || s === 'wc') return 'wc';
                if (s.includes('free') || s === 'fh') return 'fh';
                if (s.includes('bboost') || s.includes('bench') || s === 'bb') return 'bb';
                if (s.includes('3c') || s.includes('3xc') || s.includes('triple') || s === 'tc') return 'tc';
                return s;
            };

            const activeNorm = normalize(activeChip);

            const statusMap = {};
            if (chipsData && typeof chipsData === 'object') {
                Object.keys(chipsData).forEach(k => {
                    const normKey = normalize(k);
                    const val = chipsData[k];
                    if (val === false || val === 'used') statusMap[normKey] = 'used';
                    else if (val === true || val === 'available') statusMap[normKey] = 'available';
                });
            }

            return `<div class="chip-inventory">` + standardChips.map(chip => {
                let state = 'available';

                if (activeNorm === chip.id) {
                    state = 'active';
                } else if (statusMap[chip.id] === 'used') {
                    state = 'used';
                }

                return `<span class="chip-pill ${state}">${chip.label}</span>`;
            }).join('') + `</div>`;
        }

        function formatTransfers(rawText, hits) {
            if (!rawText || rawText === 'None') {
                return hits && hits > 0 ? `(-${hits} pts hit)` : 'None';
            }
            const ins = [];
            const outs = [];
            const inMatches = rawText.match(/In:\s*([^,\/]+)/gi);
            const outMatches = rawText.match(/Out:\s*([^,\/]+)/gi);
            
            if (inMatches) {
                inMatches.forEach(m => {
                    const name = m.replace(/In:\s*/i, '').trim();
                    if (name && !ins.includes(name)) ins.push(name);
                });
            }
            if (outMatches) {
                outMatches.forEach(m => {
                    const name = m.replace(/Out:\s*/i, '').trim();
                    if (name && !outs.includes(name)) outs.push(name);
                });
            }
            
            if (ins.length === 0 && outs.length === 0) {
                let res = String(rawText);
                if (hits && hits > 0 && !res.includes('pt')) res += ` (-${hits} pts)`;
                return res;
            }
            
            let resultParts = [];
            if (ins.length > 0) resultParts.push(`In: ${ins.join(', ')}`);
            if (outs.length > 0) resultParts.push(`Out: ${outs.join(', ')}`);
            
            let finalStr = resultParts.join(' | ');
            if (hits && hits > 0 && !finalStr.includes('pt')) {
                finalStr += ` (-${hits} pts)`;
            }
            return finalStr;
        }

        function getManagerKey(manager) {
            return String(manager.managerName || manager.name || '').trim().toLowerCase();
        }

        function getManagerPoints(manager) {
            return Number(manager.netPoints !== undefined ? manager.netPoints : manager.livePoints) || 0;
        }

        function rankKeysByScore(keys, scoreMap) {
            const sorted = [...keys].sort((a, b) => {
                const scoreDiff = (scoreMap[b] || 0) - (scoreMap[a] || 0);
                return scoreDiff || a.localeCompare(b);
            });

            const ranks = {};
            let previousScore = null;
            let previousRank = 0;
            sorted.forEach((key, index) => {
                const score = scoreMap[key] || 0;
                const rank = previousScore !== null && score === previousScore ? previousRank : index + 1;
                ranks[key] = rank;
                previousScore = score;
                previousRank = rank;
            });
            return ranks;
        }

        function decorateGameweekData(gameweeks) {
            const cumulative = {};
            const previousOverallRanks = {};
            const formHistory = {};
            const pointsHistory = {};

            gameweeks.forEach((gameweek, gwIndex) => {
                const standings = Array.isArray(gameweek.standings) ? gameweek.standings : [];
                const isUpcomingGameweek = gameweek.isUpcoming === true;
                const isNonParticipant = manager => {
                    const key = getManagerKey(manager);
                    return Number(gameweek.gameweek) === 1 && key === 'charlie';
                };
                const participatingStandings = isUpcomingGameweek
                    ? []
                    : standings.filter(manager => !isNonParticipant(manager));
                const managerKeys = participatingStandings.map(getManagerKey).filter(Boolean);
                const weeklyScores = {};

                participatingStandings.forEach(manager => {
                    const key = getManagerKey(manager);
                    if (!key) return;
                    const points = getManagerPoints(manager);
                    weeklyScores[key] = points;
                    cumulative[key] = (cumulative[key] || 0) + points;
                    if (!formHistory[key]) formHistory[key] = [];
                    if (!pointsHistory[key]) pointsHistory[key] = [];
                });

                const weeklyRanks = rankKeysByScore(managerKeys, weeklyScores);
                const overallRanks = rankKeysByScore(Object.keys(cumulative), cumulative);

                standings.forEach(manager => {
                    const key = getManagerKey(manager);
                    if (!key) return;

                    if (isUpcomingGameweek) {
                        const recentForm = (formHistory[key] || []).slice(-5);
                        const recentPoints = (pointsHistory[key] || []).slice(-5);
                        const paddedForm = Array(Math.max(0, 5 - recentForm.length)).fill(null).concat(recentForm);

                        manager.uiMeta = {
                            upcoming: true,
                            weeklyRank: null,
                            overallRank: previousOverallRanks[key] || null,
                            rankMovement: 0,
                            form: paddedForm,
                            fiveGwAverage: recentPoints.length
                                ? recentPoints.reduce((sum, value) => sum + value, 0) / recentPoints.length
                                : null
                        };
                        return;
                    }

                    if (isNonParticipant(manager)) {
                        manager.uiMeta = {
                            notParticipating: true,
                            weeklyRank: null,
                            overallRank: null,
                            rankMovement: 0,
                            form: [null, null, null, null, null],
                            fiveGwAverage: null
                        };
                        return;
                    }

                    formHistory[key].push(weeklyRanks[key]);
                    pointsHistory[key].push(getManagerPoints(manager));
                    const recentForm = formHistory[key].slice(-5);
                    const recentPoints = pointsHistory[key].slice(-5);
                    const paddedForm = Array(Math.max(0, 5 - recentForm.length)).fill(null).concat(recentForm);
                    const previousRank = previousOverallRanks[key];
                    const currentRank = overallRanks[key];

                    manager.uiMeta = {
                        weeklyRank: weeklyRanks[key],
                        overallRank: currentRank,
                        rankMovement: gwIndex === 0 || previousRank === undefined ? 0 : previousRank - currentRank,
                        form: paddedForm,
                        fiveGwAverage: recentPoints.length
                            ? recentPoints.reduce((sum, value) => sum + value, 0) / recentPoints.length
                            : 0
                    };
                });

                Object.keys(overallRanks).forEach(key => {
                    previousOverallRanks[key] = overallRanks[key];
                });
            });
        }

        async function loadTrackerData() {
            const safetyTimer = setTimeout(() => {
                hideSplash();
            }, 5000);
            const cachedPayload = readLastGoodTrackerData();

            try {
                const separator = SCRIPT_URL.includes('?') ? '&' : '?';
                const response = await fetch(`${SCRIPT_URL}${separator}_=${Date.now()}`, {
                    cache: 'no-store'
                });
                if (!response.ok) {
                    throw new Error(`Tracker request failed with HTTP ${response.status}`);
                }
                const data = await response.json();

                if (!isUsableTrackerPayload(data, cachedPayload && cachedPayload.data)) {
                    throw new Error(data && data.error ? data.error : 'FPL returned incomplete tracker data');
                }

                clearTimeout(safetyTimer);
                if (data.updated) {
                    document.getElementById('timestamp').innerText = `Updated: ${data.updated}`;
                }
                renderApp(data);
                hasRenderedTrackerData = true;
                saveLastGoodTrackerData(data);
                clearSavedDataNotice();
            } catch (error) {
                clearTimeout(safetyTimer);
                console.error('Error fetching data:', error);
                if (cachedPayload && cachedPayload.data) {
                    if (!hasRenderedTrackerData) {
                        renderApp(cachedPayload.data);
                        hasRenderedTrackerData = true;
                        if (cachedPayload.data.updated) {
                            document.getElementById('timestamp').innerText = `Updated: ${cachedPayload.data.updated}`;
                        }
                    }
                    showSavedDataNotice(cachedPayload.savedAt);
                } else if (!hasRenderedTrackerData) {
                    document.getElementById('app').innerHTML = `
                        <div class="card">
                            <p style="color: var(--danger-color); text-align: center; font-weight: 500;">FPL is currently updating and no saved scores are available on this device yet.</p>
                        </div>`;
                } else {
                    showSavedDataNotice(null);
                }
            } finally {
                hideSplash();
            }
        }

        function toggleManagerCard(card) {
            const isExpanded = card.classList.toggle('expanded');
            card.setAttribute('aria-expanded', String(isExpanded));
        }

        function handleManagerCardKey(event, card) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                toggleManagerCard(card);
            }
        }

        function escapeProfileHtml(value) {
            return String(value === undefined || value === null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function signedProfileValue(value) {
            const number = Number(value) || 0;
            return number > 0 ? `+${number}` : String(number);
        }

        function orderedManagerProfiles(profiles) {
            const items = Array.isArray(profiles) ? profiles.slice() : [];
            if (items.length < 2) return items;

            const storageKey = 'barucsLeagueManagerProfileOrder';
            try {
                const savedOrder = JSON.parse(sessionStorage.getItem(storageKey) || '[]');
                const currentKeys = items.map(item => String(item.managerName || '').toLowerCase());
                const validSavedOrder = savedOrder.length === currentKeys.length &&
                    savedOrder.every(key => currentKeys.includes(key));

                if (validSavedOrder) {
                    return savedOrder.map(key => items.find(item => String(item.managerName || '').toLowerCase() === key));
                }

                for (let index = items.length - 1; index > 0; index--) {
                    const randomIndex = Math.floor(Math.random() * (index + 1));
                    [items[index], items[randomIndex]] = [items[randomIndex], items[index]];
                }
                sessionStorage.setItem(storageKey, JSON.stringify(items.map(item => String(item.managerName || '').toLowerCase())));
            } catch (error) {
                items.sort(() => Math.random() - 0.5);
            }
            return items;
        }

        function buildManagerProfileCarousel(data) {
            const records = data.seasonRecords || {};
            const managers = orderedManagerProfiles(data.managerProfiles || []);
            if (managers.length === 0) return '';
            const previewParams = new URLSearchParams(window.location.search);
            const previewChip = previewParams.get('previewChip');
            const previewSecondChip = previewParams.get('previewChip2') || (previewChip ? 'wc' : '');

            const profileChipMap = {};
            const profileActiveChipMap = {};
            const latestProfileStandings = gwDataStore.length > 0
                ? (gwDataStore[gwDataStore.length - 1].standings || [])
                : [];
            latestProfileStandings.forEach(manager => {
                const key = String(manager.managerName || manager.name || '').trim().toLowerCase();
                profileChipMap[key] = manager.remainingChips;
                profileActiveChipMap[key] = manager.activeChip;
            });

            // Keep the visual chip preview consistent between the newest live-GW
            // card and that same manager's season-record profile.
            if (previewChip && latestProfileStandings.length > 0) {
                const previewManager = latestProfileStandings[0];
                const previewManagerKey = String(previewManager.managerName || previewManager.name || '').trim().toLowerCase();
                profileActiveChipMap[previewManagerKey] = previewChip;
            }
            if (previewSecondChip && latestProfileStandings.length > 1) {
                const secondPreviewManager = latestProfileStandings[1];
                const secondPreviewManagerKey = String(secondPreviewManager.managerName || secondPreviewManager.name || '').trim().toLowerCase();
                profileActiveChipMap[secondPreviewManagerKey] = previewSecondChip;
            }

            const highest = records.highestScore || {};
            const lowest = records.lowestScore || {};
            const valuable = records.mostValuableTeam || {};
            const bestTransfer = records.bestTransfer || {};
            const worstTransfer = records.worstTransfer || {};
            totalProfileSlides = managers.length + 1;
            const ratingKeys = ['attack', 'defence', 'scouting', 'tactics', 'determination', 'leadership'];
            const highestRatings = {};
            const highestRatingCounts = {};
            ratingKeys.forEach(key => {
                highestRatings[key] = Math.max(...managers.map(manager => Number((manager.ratings || {})[key]) || 0));
                highestRatingCounts[key] = managers.filter(manager => Number((manager.ratings || {})[key]) === highestRatings[key]).length;
            });

            const recordRow = (label, meta, value, className = '') => `
                <li class="season-record-row">
                    <div>
                        <div class="season-record-label">${escapeProfileHtml(label)}</div>
                        <div class="season-record-meta">${escapeProfileHtml(meta)}</div>
                    </div>
                    <div class="season-record-value ${className}">${value}</div>
                </li>`;

            const transferValue = transfer => {
                if (!transfer || !transfer.playerIn) return '—';
                const difference = Number(transfer.difference) || 0;
                const differenceClass = difference > 0 ? 'positive' : (difference < 0 ? 'negative' : '');
                return `${escapeProfileHtml(transfer.playerOut)} → ${escapeProfileHtml(transfer.playerIn)}<span class="season-record-difference ${differenceClass}">${signedProfileValue(difference)} pts</span>`;
            };

            let carousel = `
                <div class="profile-carousel-shell">
                    <div class="profile-carousel-header">
                        <button id="prevProfileBtn" class="carousel-nav-btn" onclick="moveProfileSlide(-1)" aria-label="Previous profile">‹ Prev</button>
                        <div id="profileSlideTitle" class="profile-carousel-title">Season Records</div>
                        <button id="nextProfileBtn" class="carousel-nav-btn" onclick="moveProfileSlide(1)" aria-label="Next profile">Next ›</button>
                    </div>
                    <div class="gw-progress" id="profile-progress">
                        ${Array.from({ length: totalProfileSlides }, (_, index) => `<button class="gw-progress-dot" onclick="goToProfileSlide(${index})" aria-label="Go to ${index === 0 ? 'Season Records' : 'manager profile ' + index}"></button>`).join('')}
                    </div>
                    <div class="carousel-container profile-carousel-track" id="profile-carousel-track">
                        <section class="carousel-card profile-slide" id="profile-slide-0" data-profile-title="Season Records">
                            <ul class="season-record-list">
                                ${recordRow('Highest GW Score', `${highest.managerName || '—'}${highest.gameweek ? ` · GW${highest.gameweek}` : ''}`, highest.points !== undefined ? escapeProfileHtml(highest.points) : '—', 'record-gold')}
                                ${recordRow('Lowest GW Score', `${lowest.managerName || '—'}${lowest.gameweek ? ` · GW${lowest.gameweek}` : ''}`, lowest.points !== undefined ? escapeProfileHtml(lowest.points) : '—', 'record-ice')}
                                ${recordRow('Most Valuable Team', valuable.managerName || '—', valuable.teamValue ? `£${Number(valuable.teamValue).toFixed(1)}m` : '—', 'record-gold')}
                                ${recordRow('Best Transfer', `${bestTransfer.managerName || '—'}${bestTransfer.gameweek ? ` · GW${bestTransfer.gameweek}` : ''}`, transferValue(bestTransfer), 'transfer')}
                                ${recordRow('Worst Transfer', `${worstTransfer.managerName || '—'}${worstTransfer.gameweek ? ` · GW${worstTransfer.gameweek}` : ''}`, transferValue(worstTransfer), 'transfer')}
                            </ul>
                        </section>`;

            managers.forEach((manager, managerIndex) => {
                const slideIndex = managerIndex + 1;
                const ratings = manager.ratings || {};
                const stats = manager.stats || {};
                const managerKey = String(manager.managerName || '').trim().toLowerCase();
                const managerChips = renderChipsHtml(profileChipMap[managerKey], profileActiveChipMap[managerKey]);
                const transferReturn = Number(stats.transferReturn) || 0;
                const transferClass = transferReturn > 0 ? 'positive' : (transferReturn < 0 ? 'negative' : '');
                const changes = manager.ratingChanges || {};
                const ratingItems = [
                    ['Attack', 'attack', ratings.attack], ['Defence', 'defence', ratings.defence],
                    ['Scouting', 'scouting', ratings.scouting], ['Tactics', 'tactics', ratings.tactics],
                    ['Determination', 'determination', ratings.determination], ['Leadership', 'leadership', ratings.leadership]
                ];
                const statItems = [
                    ['Transfers', stats.transfers], ['Transfer pts', signedProfileValue(transferReturn), transferClass],
                    ['Goals', stats.goals], ['Assists', stats.assists],
                    ['Team value', `£${Number(stats.teamValue || 0).toFixed(1)}m`], ['Bench pts', stats.benchPoints],
                    ['Own goals', stats.ownGoals], ['Red cards', stats.redCards]
                ];

                carousel += `
                    <section class="carousel-card profile-slide" id="profile-slide-${slideIndex}" data-profile-title="${escapeProfileHtml(manager.managerName)}">
                        <div class="profile-card-header">
                            <div class="profile-identity">
                                <div class="profile-manager-name">${escapeProfileHtml(manager.managerName)}</div>
                                <div class="profile-team-name">${escapeProfileHtml(manager.teamName)}</div>
                                <div class="profile-formation">${escapeProfileHtml(manager.preferredFormation)}</div>
                            </div>
                            <div class="profile-chip-block">${managerChips}</div>
                            <div class="profile-overall">${escapeProfileHtml(manager.overallRating)}<span>MANAGER RATING</span></div>
                        </div>
                        <div class="profile-title-block">
                            <div class="profile-title-name">${escapeProfileHtml(manager.title)}</div>
                            <div class="profile-title-explanation">${escapeProfileHtml(manager.titleExplanation)}</div>
                        </div>
                        <div class="profile-rating-grid">
                            ${ratingItems.map(([label, key, value]) => {
                                const change = Number(changes[key]) || 0;
                                const changeHtml = change === 0 ? '' : `<span class="rating-change ${change > 0 ? 'up' : 'down'}">${change > 0 ? '▲' : '▼'}${Math.abs(change)}</span>`;
                                const uniqueHighest = Number(value) === highestRatings[key] && highestRatingCounts[key] === 1;
                                return `<div class="profile-rating ${uniqueHighest ? 'highest' : ''}"><span class="profile-rating-label">${label}</span><span class="profile-rating-value"><strong>${escapeProfileHtml(value)}</strong>${changeHtml}</span></div>`;
                            }).join('')}
                        </div>
                        <div class="profile-stat-grid">
                            ${statItems.map(([label, value, valueClass = '']) => `<div class="profile-stat"><div class="profile-stat-value ${valueClass}">${escapeProfileHtml(value)}</div><div class="profile-stat-label">${label}</div></div>`).join('')}
                        </div>
                    </section>`;
            });

            return carousel + '</div></div>';
        }

        function renderApp(data) {
            const appDiv = document.getElementById('app');
            let html = '';
            const previewParams = new URLSearchParams(window.location.search);
            const previewChip = previewParams.get('previewChip');
            const previewSecondChip = previewParams.get('previewChip2') || (previewChip ? 'wc' : '');
            totalPeriodSlides = 0;
            totalProfileSlides = 0;

            // 1. Gameweek Tracker Carousel Parsing with Deduplication
            gwDataStore = [];
            let rawGwStore = [];
            if (data.gameweeks && Array.isArray(data.gameweeks) && data.gameweeks.length > 0) {
                rawGwStore = data.gameweeks;
            } else {
                const legacyStandings = data.standings || (data.liveData ? data.liveData.standings : []);
                const legacyGw = data.gameweek || (data.liveData ? data.liveData.gameweek : 1);
                if (legacyStandings.length > 0) {
                    rawGwStore = [{
                        gameweek: legacyGw,
                        isLive: true,
                        standings: legacyStandings
                    }];
                }
            }

            // Deduplicate gameweeks by GW number to prevent duplicates
            const seenGws = new Set();
            rawGwStore.forEach(gw => {
                const gwNum = gw.gameweek !== undefined ? Number(gw.gameweek) : (gw.gw !== undefined ? Number(gw.gw) : null);
                if (gwNum !== null) {
                    if (!seenGws.has(gwNum)) {
                        seenGws.add(gwNum);
                        gwDataStore.push(gw);
                    }
                } else {
                    gwDataStore.push(gw);
                }
            });
            gwDataStore.sort((a, b) => (Number(a.gameweek || a.gw || 0)) - (Number(b.gameweek || b.gw || 0)));
            decorateGameweekData(gwDataStore);

            if (gwDataStore.length > 0) {
                totalGwSlides = gwDataStore.length;
                html += `<div class="gw-shell">`;
                
                html += `
                    <div class="gw-carousel-header">
                        <button id="prevGwBtn" class="carousel-nav-btn" onclick="moveGwSlide(-1)" aria-label="Previous gameweek">‹ Prev</button>
                        <div class="gw-title-stack">
                            <div id="gwSlideTitle" class="gw-title"></div>
                            <div id="gwSlideStatus" class="gw-status"></div>
                        </div>
                        <button id="nextGwBtn" class="carousel-nav-btn" onclick="moveGwSlide(1)" aria-label="Next gameweek">Next ›</button>
                    </div>

                    <div class="gw-progress" id="gw-progress">
                        ${gwDataStore.map((_, index) => `<button class="gw-progress-dot" data-gw-index="${index}" onclick="goToGwSlide(${index})" aria-label="Go to gameweek ${index + 1}"></button>`).join('')}
                    </div>

                    <div class="carousel-container" id="gw-carousel-track" style="margin-bottom: 24px;">
                `;

                gwDataStore.forEach((gwGroup, gwIdx) => {
                    const standings = gwGroup.standings || [];
                    standings.sort((a, b) => {
                        const pA = a.netPoints !== undefined ? a.netPoints : (a.livePoints !== undefined ? a.livePoints : 0);
                        const pB = b.netPoints !== undefined ? b.netPoints : (b.livePoints !== undefined ? b.livePoints : 0);
                        return pB - pA;
                    });

                    html += `<div class="carousel-card" id="gw-slide-${gwIdx}">`;

                    standings.forEach((mgr, managerIndex) => {
                        const managerName = mgr.managerName || mgr.name || '';
                        const teamName = mgr.teamName || TEAM_NAMES[managerName] || '';
                        // The query-string chip is only a visual preview for the newest
                        // gameweek. Applying it to every rendered slide makes it appear
                        // as though the manager played the chip in previous weeks too.
                        const isLatestGameweek = gwIdx === gwDataStore.length - 1;
                        let displayedActiveChip = mgr.activeChip;
                        if (isLatestGameweek && managerIndex === 0 && previewChip) {
                            displayedActiveChip = previewChip;
                        } else if (isLatestGameweek && managerIndex === 1 && previewSecondChip) {
                            displayedActiveChip = previewSecondChip;
                        }
                        const hasActiveChip = displayedActiveChip !== null && displayedActiveChip !== undefined && displayedActiveChip !== '' && displayedActiveChip !== 'None';
                        const chipLabel = getChipDisplayName(displayedActiveChip || mgr.chipDisplay);

                        // Robustly resolve Star Performer data
                        const getPerformer = (m, keys) => {
                            for (let k of keys) {
                                if (m[k] !== undefined && m[k] !== null && m[k] !== '' && m[k] !== 'None') {
                                    return m[k];
                                }
                            }
                            return null;
                        };

                        const starObj = getPerformer(mgr, ['starPerformer', 'star', 'star_name', 'bestPerformer']);
                        const worstObj = getPerformer(mgr, ['worstPerformer', 'worst', 'worst_name', 'worstPlayer']);

                        const starName = starObj ? (typeof starObj === 'object' ? (starObj.name || starObj.player || starObj.playerName || 'None') : starObj) : null;
                        const starPts = starObj && typeof starObj === 'object' ? (starObj.points !== undefined ? starObj.points : (starObj.pts !== undefined ? starObj.pts : 0)) : 0;
                        
                        const worstName = worstObj ? (typeof worstObj === 'object' ? (worstObj.name || worstObj.player || worstObj.playerName || 'None') : worstObj) : null;
                        const worstPts = worstObj && typeof worstObj === 'object' ? (worstObj.points !== undefined ? worstObj.points : (worstObj.pts !== undefined ? worstObj.pts : 0)) : 0;

                        const rawPoints = mgr.netPoints !== undefined ? mgr.netPoints : (mgr.livePoints !== undefined ? mgr.livePoints : 0);
                        const isNonParticipant = Boolean(mgr.uiMeta && mgr.uiMeta.notParticipating);
                        const hasNoEntry = isNonParticipant || Boolean(gwGroup.isUpcoming) || (Boolean(gwGroup.isLive) && Number(rawPoints) === 0 && !starName && !worstName);
                        const pointsDisplay = hasNoEntry ? '–' : rawPoints;

                        let rawTransfers = 'None';
                        if (mgr.transfersText && mgr.transfersText !== 'None') {
                            rawTransfers = String(mgr.transfersText);
                        } else if (mgr.transfers) {
                            if (Array.isArray(mgr.transfers)) {
                                rawTransfers = mgr.transfers.length > 0 ? mgr.transfers.join(', ') : 'None';
                            } else if (typeof mgr.transfers === 'object') {
                                rawTransfers = Object.values(mgr.transfers).join(', ');
                            } else {
                                rawTransfers = String(mgr.transfers);
                            }
                        } else if (mgr.transfersMade !== undefined && mgr.transfersMade !== null) {
                            const hitCost = mgr.transferCost || mgr.event_transfers_cost || mgr.hitCost || mgr.hits;
                            const hitStr = hitCost ? ` (-${hitCost} pts)` : '';
                            rawTransfers = `${mgr.transfersMade} made${hitStr}`;
                        } else if (mgr.event_transfers !== undefined) {
                            rawTransfers = `${mgr.event_transfers} made`;
                        }

                        let transfersText = formatTransfers(rawTransfers, mgr.hits);
                        const transfersHtml = String(transfersText)
                            .split(/\s*\|\s*/)
                            .map(part => `<span class="transfer-line">${part}</span>`)
                            .join('');

                        const meta = mgr.uiMeta || { weeklyRank: 4, overallRank: 4, rankMovement: 0, form: [null, null, null, null, null], fiveGwAverage: 0 };
                        const rankClass = meta.notParticipating || meta.upcoming ? '' : `rank-card-${Math.min(meta.weeklyRank || 4, 4)}`;
                        const transferEffect = Number(mgr.transferEffectiveness);
                        const hitClass = mgr.transferEffectiveness !== null && mgr.transferEffectiveness !== undefined
                            ? (transferEffect >= 1 ? 'transfer-positive' : (transferEffect <= -1 ? 'transfer-negative' : ''))
                            : '';
                        const hasTransferResult = mgr.transferEffectiveness !== null && mgr.transferEffectiveness !== undefined;
                        const transferResultClass = transferEffect > 0 ? 'positive' : (transferEffect < 0 ? 'negative' : 'level');
                        const transferResultText = hasTransferResult
                            ? `<span class="transfer-result ${transferResultClass}">Result ${transferEffect > 0 ? '+' : ''}${transferEffect} pts</span>`
                            : '';
                        const playersLeft = mgr.playersLeft !== null && mgr.playersLeft !== undefined ? Number(mgr.playersLeft) : null;
                        const playersLeftHtml = Boolean(gwGroup.isLive) && playersLeft !== null && !hasNoEntry
                            ? `<div class="players-left">${playersLeft} ${playersLeft === 1 ? 'player' : 'players'} left</div>`
                            : '';
                        const movementClass = meta.rankMovement > 0 ? 'rank-up' : (meta.rankMovement < 0 ? 'rank-down' : 'rank-level');
                        const movementIcon = meta.rankMovement > 0 ? '▲' : (meta.rankMovement < 0 ? '▼' : '—');
                        const overallDisplay = meta.notParticipating
                            ? '–'
                            : `#${meta.overallRank || '–'} <span class="${movementClass}">${movementIcon}</span>`;
                        const formHtml = (meta.form || []).map(position => {
                            const cls = position ? `form-rank-${Math.min(position, 4)}` : '';
                            return `<span class="form-position ${cls}">${position || '–'}</span>`;
                        }).join('');
                        const averageDisplay = meta.notParticipating || meta.fiveGwAverage === null
                            ? '–'
                            : Number(meta.fiveGwAverage || 0).toFixed(1);
                        const cardClass = `fut-card manager-item ${rankClass} ${hasActiveChip ? 'glow-gold' : ''}`;

                        html += `
                            <div class="manager-glow-wrap ${hitClass}">
                              <div class="${cardClass}" role="button" tabindex="0" aria-expanded="false" aria-label="Show details for ${managerName}" onclick="toggleManagerCard(this)" onkeydown="handleManagerCardKey(event, this)">
                                <div class="manager-summary">
                                    <div>
                                        <span class="manager-name">${managerName}</span>
                                        <div class="manager-team">${teamName}</div>
                                        <div class="chip-slot ${hasActiveChip ? 'active' : ''}">${hasActiveChip ? `${chipLabel} ACTIVE` : 'No active chip'}</div>
                                    </div>
                                    <div class="manager-score">
                                        <div class="manager-score-value">${pointsDisplay}</div>
                                        <div class="manager-score-label">GW PTS</div>
                                        ${playersLeftHtml}
                                        <div class="compact-overall">${overallDisplay}</div>
                                    </div>
                                </div>

                                <div class="form-row">
                                    <span class="form-label">FORM</span>
                                    ${formHtml}
                                    <span class="form-average">5GW AVG <strong>${averageDisplay}</strong></span>
                                    <span class="expand-hint"><span class="expand-hint-icon">⌄</span></span>
                                </div>
                                
                                <div class="card-dropdown">
                                    <div class="detail-list">
                                        <div class="detail-row star">
                                            <div class="detail-row-label">⭐ Star</div>
                                            <div class="detail-row-name">${starName || 'None'}</div>
                                            <div class="detail-row-points">${starPts} pts</div>
                                        </div>
                                        <div class="detail-row worst">
                                            <div class="detail-row-label">💩 Worst</div>
                                            <div class="detail-row-name">${worstName || 'None'}</div>
                                            <div class="detail-row-points">${worstPts} pts</div>
                                        </div>
                                        <div class="detail-row transfer">
                                            <div class="detail-row-label">🔄 Transfers</div>
                                            <div class="detail-row-name">${transfersHtml}</div>
                                            <div class="detail-row-points">${Number(mgr.hits) > 0 ? `-${Number(mgr.hits)} pts` : 'No hit'}</div>
                                        </div>
                                    </div>
                                </div>
                              </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                });

                html += `</div></div>`;
            }

            // 2. Manager of the Month Carousel
            if (data.monthly && data.monthly.length > 0) {
                const activePeriods = data.monthly.filter(period => {
                    if (!period.scores || period.scores.length === 0) return false;
                    if (period.title.toLowerCase().includes('period period') || period.title.toLowerCase().includes('monthly side pot')) return false;
                    
                    const hasStarted = period.scores.some(s => Number(s.score) > 0);
                    if (!hasStarted) return false;

                    const isMalformed = period.scores.every(s => String(s.score) === s.name);
                    return !isMalformed;
                });

                if (activePeriods.length > 0) {
                    totalPeriodSlides = activePeriods.length;
                    html += `<div class="tracker-shell"><div class="section-title">Manager of the Month</div>`;

                    html += `
                        <div class="period-carousel-header ${activePeriods.length === 1 ? 'single-period' : ''}">
                            <button id="prevPeriodBtn" class="carousel-nav-btn" onclick="movePeriodSlide(-1)" aria-label="Previous Manager of the Month period">‹ Prev</button>
                            <div id="periodSlideTitle" class="period-carousel-title"></div>
                            <button id="nextPeriodBtn" class="carousel-nav-btn" onclick="movePeriodSlide(1)" aria-label="Next Manager of the Month period">Next ›</button>
                        </div>
                        <div class="gw-progress" id="period-progress">
                            ${activePeriods.map((_, index) => `<button class="gw-progress-dot" data-period-index="${index}" onclick="goToPeriodSlide(${index})" aria-label="Go to Manager of the Month period ${index + 1}"></button>`).join('')}
                        </div>
                    `;

                    html += `<div class="carousel-container" id="period-carousel">`;
                    
                    activePeriods.forEach((period, periodIndex) => {
                        let cleanTitle = period.title.replace(/^Period\s+\d+\s*\(([^)]+)\)/i, '$1');

                        const formatPrize = (p) => {
                            if (!p) return '£0';
                            let str = String(p).trim();
                            return str.startsWith('£') ? str : '£' + str;
                        };

                        const rankedPeriodScores = (period.scores || [])
                            .map(score => ({
                                ...score,
                                numericScore: Number(String(score.score === undefined || score.score === null ? 0 : score.score).replace(/[^0-9.-]/g, '')) || 0
                            }))
                            .sort((first, second) => second.numericScore - first.numericScore || String(first.name).localeCompare(String(second.name)));

                        const periodMovement = {};
                        const periodWeekNumbers = (cleanTitle.match(/\d+/g) || []).map(Number);
                        const periodStart = periodWeekNumbers[0];
                        const periodEnd = periodWeekNumbers[1] || periodStart;
                        const relevantGameweeks = Number.isFinite(periodStart)
                            ? gwDataStore.filter(gameweek => {
                                const number = Number(gameweek.gameweek !== undefined ? gameweek.gameweek : gameweek.gw);
                                return number >= periodStart && number <= periodEnd && !gameweek.isUpcoming;
                            })
                            : [];

                        rankedPeriodScores.forEach(score => {
                            periodMovement[String(score.name || '').trim().toLowerCase()] = 0;
                        });

                        if (relevantGameweeks.length > 1) {
                            const latestPeriodWeek = relevantGameweeks[relevantGameweeks.length - 1];
                            const latestWeekPoints = {};
                            (latestPeriodWeek.standings || []).forEach(manager => {
                                latestWeekPoints[getManagerKey(manager)] = getManagerPoints(manager);
                            });

                            const keys = rankedPeriodScores.map(score => String(score.name || '').trim().toLowerCase());
                            const currentScores = {};
                            const previousScores = {};
                            rankedPeriodScores.forEach(score => {
                                const key = String(score.name || '').trim().toLowerCase();
                                currentScores[key] = score.numericScore;
                                previousScores[key] = score.numericScore - (latestWeekPoints[key] || 0);
                            });

                            const currentRanks = rankKeysByScore(keys, currentScores);
                            const previousRanks = rankKeysByScore(keys, previousScores);
                            keys.forEach(key => {
                                periodMovement[key] = previousRanks[key] - currentRanks[key];
                            });
                        }

                        html += `
                            <div class="carousel-card period-slide-card" id="period-slide-${periodIndex}" data-period-title="${cleanTitle}">
                                <ul style="list-style: none; padding: 0; margin: 0 0 14px 0;">
                                    ${rankedPeriodScores.map((s, idx) => {
                                        const scoreDisplay = String(s.numericScore);
                                        const teamName = TEAM_NAMES[s.name] || '';
                                        const scoreColour = idx === 0 ? 'var(--gold-color)' : (idx === 1 ? 'var(--silver-color)' : 'var(--text-color)');
                                        const movement = periodMovement[String(s.name || '').trim().toLowerCase()] || 0;
                                        const movementClass = movement > 0 ? 'rank-up' : (movement < 0 ? 'rank-down' : 'rank-level');
                                        const movementText = movement > 0 ? '▲' : (movement < 0 ? '▼' : '—');
                                        return `
                                            <li class="period-standing-row rank-${idx + 1}" style="display: flex; justify-content: space-between; align-items: center;">
                                                <div>
                                                    <div style="font-weight: 600; font-size: 0.9rem; color: #ffffff;">${s.name}</div>
                                                    ${teamName ? `<div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 1px;">${teamName}</div>` : ''}
                                                </div>
                                                <div class="standing-points-wrap"><span class="standing-movement ${movementClass}">${movementText}</span><span style="font-weight: 800; font-size: 1rem; color: ${scoreColour};">${scoreDisplay}</span></div>
                                            </li>
                                        `;
                                    }).join('')}
                                </ul>
                                <div class="period-prize-grid">
                                    <div class="period-prize winner"><strong>Winner</strong>${period.topScorer || 'TBD'} <span>– ${formatPrize(period.winnerPrize)}</span></div>
                                    <div class="period-prize runner"><strong>Runner-up</strong>${period.runnerName || 'TBD'} <span>– ${formatPrize(period.runnerPrize)}</span></div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                }
            }

            // 3. Overall Standings Table
            let topWeeksWonPlayer = null;
            let maxWeeksWon = -1;

            if (data.overall && data.overall.rows && data.overall.rows.length > 0) {
                const headers = data.overall.headers || [];
                const getCol = (name, fallback) => {
                    const idx = headers.findIndex(h => h && h.toString().toLowerCase().includes(name));
                    return idx !== -1 ? idx : fallback;
                };

                const playerIdx = getCol('player', getCol('name', 0));
                const pointsIdx = getCol('point', getCol('total', 1));
                const weeksWonIdx = getCol('won', getCol('week', 3));
                const prizeIdx = getCol('prize', 5);

                const totalRows = data.overall.rows.length;

                const chipMap = {};
                const activeChipMap = {};

                const latestPlayedGameweek = [...gwDataStore]
                    .reverse()
                    .find(gameweek => !gameweek.isUpcoming && Array.isArray(gameweek.standings) && gameweek.standings.length > 0);
                const latestStandings = latestPlayedGameweek ? latestPlayedGameweek.standings : [];
                const overallMovementMap = {};
                if (latestStandings) {
                    latestStandings.forEach(m => {
                        const key = (m.managerName || m.name || '').trim().toLowerCase();
                        chipMap[key] = m.remainingChips;
                        activeChipMap[key] = m.activeChip;
                        overallMovementMap[key] = Number((m.uiMeta || {}).rankMovement) || 0;
                    });
                }

                data.overall.rows.forEach(row => {
                    const pName = row[playerIdx];
                    const wWon = Number(row[weeksWonIdx]) || 0;
                    if (wWon > maxWeeksWon) {
                        maxWeeksWon = wWon;
                        topWeeksWonPlayer = { player: pName, val: wWon };
                    }
                });

                const overallWinnerRow = data.overall.rows[0] || [];
                const overallRunnerRow = data.overall.rows[1] || [];
                const overallPrizeText = row => {
                    const rawPrize = row[prizeIdx] !== undefined ? row[prizeIdx] : 0;
                    return String(rawPrize).startsWith('£') ? String(rawPrize) : '£' + rawPrize;
                };

                html += `
                    <div class="overall-standings-section">
                        <div class="section-title" style="margin-bottom: 16px;">Overall Standings</div>
                        <div class="overall-standings-head">
                            <span>Manager</span><span>Points</span>
                        </div>
                        <div class="overall-standing-list">
                                    ${data.overall.rows.map((row, rIdx) => {
                                        const playerName = row[playerIdx] || '';
                                        const points = row[pointsIdx] !== undefined ? row[pointsIdx] : '';
                                        const teamName = TEAM_NAMES[playerName] || '';
                                        const movement = overallMovementMap[String(playerName).trim().toLowerCase()] || 0;
                                        const movementClass = movement > 0 ? 'rank-up' : (movement < 0 ? 'rank-down' : 'rank-level');
                                        const movementText = movement > 0 ? '▲' : (movement < 0 ? '▼' : '—');

                                        return `
                                            <div class="overall-standing-tile rank-${rIdx + 1}">
                                                <div><div class="overall-tile-name">${playerName}</div>${teamName ? `<div class="overall-tile-team">${teamName}</div>` : ''}</div>
                                                <div class="standing-points-wrap"><span class="standing-movement ${movementClass}">${movementText}</span><span class="overall-tile-points">${points}</span></div>
                                            </div>
                                        `;
                                    }).join('')}
                        </div>
                        <div class="period-prize-grid">
                            <div class="period-prize winner"><strong>Winner</strong>${overallWinnerRow[playerIdx] || 'TBD'} <span>– ${overallPrizeText(overallWinnerRow)}</span></div>
                            <div class="period-prize runner"><strong>Runner-up</strong>${overallRunnerRow[playerIdx] || 'TBD'} <span>– ${overallPrizeText(overallRunnerRow)}</span></div>
                        </div>
                    </div>
                `;
            }

            // 4. Transfer Market season totals
            if (false && Array.isArray(data.transferMarket) && data.transferMarket.length > 0) {
                const signed = value => `${Number(value) > 0 ? '+' : ''}${Number(value) || 0}`;
                const netColour = value => Number(value) > 0 ? 'var(--primary-color)' : (Number(value) < 0 ? 'var(--danger-color)' : 'var(--text-muted)');

        function enableEdgeWrapSwipe(track, getCurrentIndex, getTotalSlides, moveSlide) {
            let touchStartX = null;

            track.addEventListener('touchend', event => {
                if (touchStartX === null || !event.changedTouches || !event.changedTouches[0]) return;
                const distance = event.changedTouches[0].clientX - touchStartX;
                touchStartX = null;
                if (Math.abs(distance) < 45) return;

                const currentIndex = getCurrentIndex();
                const totalSlides = getTotalSlides();
                if (distance > 0 && currentIndex === 0) moveSlide(-1);
                if (distance < 0 && currentIndex === totalSlides - 1) moveSlide(1);

                if (gwButtonScrollActive) return;

                const slides = Array.from(track.querySelectorAll('.carousel-card:not(.gw-loop-clone)'));

                const firstOffset = slides[0].offsetLeft;
                let index = 0;
                let closestDistance = Infinity;

                slides.forEach((slide, slideIndex) => {
                    const slidePosition = slide.offsetLeft - firstOffset;

        function formatDeadlineBadge(deadlineValue) {

            const day = deadline.toLocaleDateString(undefined, { day: 'numeric' });
            const month = deadline.toLocaleDateString(undefined, { month: 'short' }).toUpperCase();
            const time = deadline.toLocaleTimeString(undefined, {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            return `DEADLINE · ${weekday} ${day} ${month} · ${time}`;

        function scrollGwCarousel(smooth = true, fromButton = false) {
            const track = document.getElementById('gw-carousel-track');
            const slide = document.getElementById(`gw-slide-${currentGwSlideIdx}`);
            if (track && slide) {
                const firstSlide = track.querySelector('.carousel-card');
                const firstOffset = firstSlide ? firstSlide.offsetLeft : 0;

                if (fromButton) {
                    gwButtonScrollActive = true;
                    gwButtonScrollToken += 1;
                    if (gwButtonScrollTimer) clearTimeout(gwButtonScrollTimer);

                track.scrollTo({

                    const activeScrollToken = gwButtonScrollToken;

                        if (activeScrollToken !== gwButtonScrollToken) return;
                        if (!gwButtonScrollActive) return;

                        gwButtonScrollActive = false;
                        if (gwButtonScrollTimer) {
                            clearTimeout(gwButtonScrollTimer);
                            gwButtonScrollTimer = null;

                        // Keep the departing GW label in place while the cards
                        // move, then update the title, badge, arrows and dots
                        // once the destination slide has settled.
                        updateGwCarouselHeader();

                    if ('onscrollend' in track) {
                        track.addEventListener('scrollend', releaseButtonScroll, { once: true });

                    // Fallback for browsers that do not support scrollend.
                    gwButtonScrollTimer = setTimeout(releaseButtonScroll, smooth ? 700 : 50);

        function moveGwSlide(direction) {
            if (totalGwSlides < 1) return;

                const track = document.getElementById('gw-carousel-track');
                const loopClone = document.getElementById('gw-slide-loop-first');
                const firstRealSlide = document.getElementById('gw-slide-0');
                if (track && loopClone && firstRealSlide) {

                    gwButtonScrollActive = true;
                    gwButtonScrollToken += 1;
                    const activeScrollToken = gwButtonScrollToken;
                    if (gwButtonScrollTimer) clearTimeout(gwButtonScrollTimer);

                    const firstOffset = firstRealSlide.offsetLeft;
                    track.scrollTo({
                        left: loopClone.offsetLeft - firstOffset,
                        behavior: 'smooth'
                    });

                    const finishLoop = () => {
                        if (activeScrollToken !== gwButtonScrollToken) return;
                        if (!gwButtonScrollActive) return;
                        track.scrollTo({ left: 0, behavior: 'auto' });
                        gwButtonScrollActive = false;
                        gwButtonScrollTimer = null;
                        updateGwCarouselHeader();
                    };

                    if ('onscrollend' in track) {
                        track.addEventListener('scrollend', finishLoop, { once: true });
                    }
                    gwButtonScrollTimer = setTimeout(finishLoop, 700);

            if (direction < 0 && currentGwSlideIdx === 0 && totalGwSlides > 1) {
                const track = document.getElementById('gw-carousel-track');
                const loopClone = document.getElementById('gw-slide-loop-first');
                const firstRealSlide = document.getElementById('gw-slide-0');
                const lastRealSlide = document.getElementById(`gw-slide-${totalGwSlides - 1}`);
                if (track && loopClone && firstRealSlide && lastRealSlide) {
                    currentGwSlideIdx = totalGwSlides - 1;

                    gwButtonScrollToken += 1;
                    const activeScrollToken = gwButtonScrollToken;
                    if (gwButtonScrollTimer) clearTimeout(gwButtonScrollTimer);

                    const firstOffset = firstRealSlide.offsetLeft;

                        gwButtonScrollTimer = null;

                    }
                    gwButtonScrollTimer = setTimeout(finishReverseLoop, 700);
                    return;
                }

            currentGwSlideIdx = (currentGwSlideIdx + direction + totalGwSlides) % totalGwSlides;
            scrollGwCarousel(true, true);

        function scrollProfileCarousel(smooth = true) {
            const track = document.getElementById('profile-carousel-track');
            const slide = document.getElementById(`profile-slide-${currentProfileSlideIdx}`);
            if (track && slide) {
                const firstSlide = track.querySelector('.profile-slide');
                const firstOffset = firstSlide ? firstSlide.offsetLeft : 0;
                track.scrollTo({
                    left: slide.offsetLeft - firstOffset,
                    behavior: smooth ? 'smooth' : 'auto'
                });
            }
            updateProfileCarouselHeader();
        }

        function moveProfileSlide(direction) {
            if (totalProfileSlides < 1) return;

            if (direction > 0 && currentProfileSlideIdx === totalProfileSlides - 1 && totalProfileSlides > 1) {
                const track = document.getElementById('profile-carousel-track');
                const clone = document.getElementById('profile-slide-loop-first');
                const first = document.getElementById('profile-slide-0');
                if (track && clone && first) {
                    currentProfileSlideIdx = 0;
                    profileLoopActive = true;
                    const firstOffset = first.offsetLeft;
                    track.scrollTo({ left: clone.offsetLeft - firstOffset, behavior: 'smooth' });
                    setTimeout(() => {
                        track.scrollTo({ left: 0, behavior: 'auto' });
                        profileLoopActive = false;
                        updateProfileCarouselHeader();
                    }, 700);
                    return;
                }
            }

            if (direction < 0 && currentProfileSlideIdx === 0 && totalProfileSlides > 1) {
                const track = document.getElementById('profile-carousel-track');
                const clone = document.getElementById('profile-slide-loop-first');
                const first = document.getElementById('profile-slide-0');
                const last = document.getElementById(`profile-slide-${totalProfileSlides - 1}`);
                if (track && clone && first && last) {
                    currentProfileSlideIdx = totalProfileSlides - 1;
                    profileLoopActive = true;
                    const firstOffset = first.offsetLeft;
                    track.scrollTo({ left: clone.offsetLeft - firstOffset, behavior: 'auto' });
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        track.scrollTo({ left: last.offsetLeft - firstOffset, behavior: 'smooth' });
                    }));
                    setTimeout(() => {
                        profileLoopActive = false;
                        updateProfileCarouselHeader();
                    }, 700);
                    return;
                }
            }

            currentProfileSlideIdx = (currentProfileSlideIdx + direction + totalProfileSlides) % totalProfileSlides;
            scrollProfileCarousel(true);
        }

        function goToProfileSlide(index) {
            if (index >= 0 && index < totalProfileSlides) {
                currentProfileSlideIdx = index;
                scrollProfileCarousel(true);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTrackerData();
            window.setInterval(() => {
                if (!document.hidden) loadTrackerData();
            }, 120000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) loadTrackerData();
            });
        });
    </script>
