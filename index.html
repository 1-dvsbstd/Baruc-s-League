<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baruc's League - FPL Side Pot Tracker</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#190df5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Google Fonts for Premier League Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --surface-color: #1a0524;
            --card-bg: #2b083b;
            --primary-color: #00ff87;
            --accent-color: #02efff;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #4a155f;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--surface-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 16px;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            text-shadow: 0 2px 8px rgba(0,255,135,0.2);
        }

        /* Splash Screen Styling */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--surface-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease-out;
        }

        #splash-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
            margin-bottom: 0;
            animation: none;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* App Container */
        #app {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* Section Headings */
        .section-title {
            color: var(--primary-color);
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 0 0 12px 0;
        }

        /* Card Styles */
        .fut-card {
            position: relative;
            cursor: pointer;
            background: #111a16;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .fut-card.glow-gold {
            border: 2px solid #ffd700 !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4), inset 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .chip-badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            text-transform: uppercase;
            background: #ffd700;
            color: #1a0524;
        }

        .card-dropdown {
            margin-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
            font-size: 0.85rem;
            display: none;
        }
        .fut-card.expanded .card-dropdown {
            display: block;
        }

        /* Overall Standings Chip Inventory Pills */
        .chip-inventory {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .chip-pill {
            font-size: 0.55rem;
            padding: 1px 4px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chip-pill.available {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.3);
        }

        /* Carousel Styling */
        .carousel-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 16px;
            padding-bottom: 8px;
            scrollbar-width: none;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-card {
            min-width: 100%;
            box-sizing: border-box;
            scroll-snap-align: start;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--border-color);
            transition: all 0.3s ease;
        }
        .dot.active {
            width: 20px;
            border-radius: 4px;
            background-color: var(--primary-color);
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Splash Screen Overlay -->
    <div id="splash-screen">
        <img src="splash-bg.png" alt="Loading">
    </div>

    <h1>Baruc's League</h1>
    
    <div id="app">
        <div class="loading-text">Loading tracker data...</div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVQrIeCr5DL5HRBBH13eycceCb7l8VD0X3YnX3ZB0v321OBMAsSLCw5fgChvTQl8Emaw/exec';
        const LIVE_API_URL = 'https://script.google.com/macros/s/AKfycbzVQrIeCr5DL5HRBBH13eycceCb7l8VD0X3YnX3ZB0v321OBMAsSLCw5fgChvTQl8Emaw/exec';

        const TEAM_NAMES = {
            "Nathan": "nr xi",
            "Mike": "mikes marauders",
            "Carl": "Ginger Ninjas",
            "Charlie": "Oakley1"
        };

        function hideSplash() {
            const splash = document.getElementById('splash-screen');
            if (splash && !splash.classList.contains('fade-out')) {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 400);
            }
        }

        async function loadTrackerData() {
            const safetyTimer = setTimeout(() => {
                hideSplash();
            }, 5000);

            try {
                const [mainResponse, liveResponse] = await Promise.all([
                    fetch(SCRIPT_URL),
                    fetch(LIVE_API_URL).catch(() => null)
                ]);

                const data = await mainResponse.json();
                let liveData = null;
                if (liveResponse && liveResponse.ok) {
                    try {
                        liveData = await liveResponse.json();
                    } catch (e) {
                        console.warn('Could not parse live tracker payload', e);
                    }
                }

                clearTimeout(safetyTimer);
                renderApp(data, liveData);
            } catch (error) {
                clearTimeout(safetyTimer);
                console.error('Error fetching data:', error);
                document.getElementById('app').innerHTML = `
                    <div class="card">
                        <p style="color: #ff4b4b; text-align: center; font-weight: 500;">Unable to load data. Please check your connection or Apps Script URL.</p>
                    </div>`;
            } finally {
                hideSplash();
            }
        }

        function renderApp(data, liveData) {
            const appDiv = document.getElementById('app');
            let html = '';

            // 0. Render Live GW Tracker Section if liveData exists
            if (liveData && liveData.standings) {
                html += `<div class="section-title">Live GW ${liveData.gameweek} Tracker</div>`;
                liveData.standings.forEach(mgr => {
                    const hasActiveChip = mgr.activeChip !== null;
                    const cardClass = hasActiveChip ? 'fut-card glow-gold' : 'fut-card';
                    const chipLabel = mgr.activeChip ? mgr.activeChip.toUpperCase() : '';

                    html += `
                        <div class="${cardClass}" onclick="this.classList.toggle('expanded')">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <span style="font-weight: 700; font-size: 1rem; color: #fff;">${mgr.managerName}</span>
                                    ${hasActiveChip ? `<span class="chip-badge">${chipLabel} ACTIVE</span>` : ''}
                                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Team: ${mgr.teamName}</div>
                                </div>
                                <span style="font-weight: 800; font-size: 1.1rem; color: var(--primary-color);">${mgr.livePoints} pts ▾</span>
                            </div>
                            
                            <div class="card-dropdown">
                                <div style="margin-bottom: 5px;">👑 <strong>Captain:</strong> ${mgr.captain.name} (${mgr.captain.points} pts)</div>
                                <div style="margin-bottom: 5px; color: var(--primary-color);">⭐ <strong>Star:</strong> ${mgr.starPerformer.name} (${mgr.starPerformer.points} pts)</div>
                                <div style="margin-bottom: 4px; color: #ff4b4b;">💩 <strong>Worst:</strong> ${mgr.worstPerformer.name} (${mgr.worstPerformer.points} pts)</div>
                            </div>
                        </div>
                    `;
                });
            }

            // 1. Render Manager of the Month Carousel with Filter for Unstarted Periods
            if (data.monthly && data.monthly.length > 0) {
                const activePeriods = data.monthly.filter(period => {
                    if (!period.scores || period.scores.length === 0) return false;
                    if (period.title.toLowerCase().includes('period period') || period.title.toLowerCase().includes('monthly side pot')) return false;
                    
                    const hasStarted = period.scores.some(s => Number(s.score) > 0);
                    if (!hasStarted) return false;

                    const isMalformed = period.scores.every(s => String(s.score) === s.name);
                    return !isMalformed;
                });

                if (activePeriods.length > 0) {
                    html += `<div class="section-title" style="margin-top: 20px;">Manager of the Month</div>`;
                    
                    html += `<div class="carousel-dots" id="carousel-dots">`;
                    activePeriods.forEach((_, index) => {
                        const isActive = index === activePeriods.length - 1 ? 'active' : '';
                        html += `<div class="dot ${isActive}" data-index="${index}"></div>`;
                    });
                    html += `</div>`;

                    html += `<div class="carousel-container" id="period-carousel">`;
                    
                    activePeriods.forEach(period => {
                        let cleanTitle = period.title.replace(/^Period\s+\d+\s*\(([^)]+)\)/i, '$1');

                        const formatPrize = (p) => {
                            if (!p) return '£0';
                            let str = String(p).trim();
                            return str.startsWith('£') ? str : '£' + str;
                        };

                        html += `
                            <div class="card carousel-card">
                                <h4 style="margin-top: 0; margin-bottom: 16px; color: var(--accent-color); font-size: 1.05rem; font-weight: 700; border-bottom: 1px solid var(--border-subtle); padding-bottom: 10px; letter-spacing: 0.3px;">${cleanTitle}</h4>
                                <ul style="list-style: none; padding: 0; margin: 0 0 16px 0;">
                                    ${period.scores.map((s, idx, arr) => {
                                        let scoreDisplay = String(s.score !== undefined && s.score !== null ? s.score : '');
                                        if (idx === arr.length - 1 && !scoreDisplay.includes('💩')) {
                                            scoreDisplay += ' 💩';
                                        }
                                        const teamName = TEAM_NAMES[s.name] || '';
                                        return `
                                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-subtle);">
                                                <div>
                                                    <div style="font-weight: 600; font-size: 0.95rem; color: #ffffff;">${s.name}</div>
                                                    ${teamName ? `<div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${teamName}</div>` : ''}
                                                </div>
                                                <span style="font-weight: 700; font-size: 1.05rem; color: var(--primary-color);">${scoreDisplay}</span>
                                            </li>
                                        `;
                                    }).join('')}
                                </ul>
                                <div style="font-size: 0.85rem; color: var(--text-muted); background: rgba(0,0,0,0.25); padding: 12px; border-radius: 10px; border: 1px solid var(--border-subtle);">
                                    <div style="margin-bottom: 4px;">🏆 <strong style="color: #fff;">Winner:</strong> ${period.topScorer} <span style="color: var(--primary-color);">(${formatPrize(period.winnerPrize)})</span></div>
                                    <div>🥈 <strong style="color: #fff;">Runner-up:</strong> ${period.runnerName} <span style="color: var(--accent-color);">(${formatPrize(period.runnerPrize)})</span></div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                }
            }

            // 2. Render Overall Standings Table
            if (data.overall && data.overall.rows) {
                const headers = data.overall.headers;
                const getCol = (name, fallback) => {
                    const idx = headers.findIndex(h => h && h.toLowerCase().includes(name));
                    return idx !== -1 ? idx : fallback;
                };

                const playerIdx = getCol('player', getCol('name', 0));
                const pointsIdx = getCol('point', getCol('total', 1));
                const medalIdx = getCol('medal', 2);
                const weeksWonIdx = getCol('won', getCol('week', 3));
                const motmIdx = getCol('motm', getCol('award', 4));
                const prizeIdx = getCol('prize', 5);

                const totalRows = data.overall.rows.length;

                const chipMap = {};
                if (liveData && liveData.standings) {
                    liveData.standings.forEach(m => {
                        chipMap[m.managerName] = m.remainingChips;
                    });
                }

                html += `
                    <div class="card" style="margin-top: 24px;">
                        <div class="section-title" style="margin-bottom: 16px;">Overall Standings</div>
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; table-layout: fixed; border-collapse: collapse; text-align: left; font-size: 0.85rem;">
                                <thead>
                                    <tr style="border-bottom: 1px solid var(--border-color); color: var(--accent-color); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;">
                                        <th style="width: 28%; padding: 0 4px 10px 4px; font-weight: 700;">Manager</th>
                                        <th style="width: 20%; padding: 0 4px 10px 4px; font-weight: 700;">Points</th>
                                        <th style="width: 18%; padding: 0 4px 10px 4px; font-weight: 700; text-align: center;">Weeks Won</th>
                                        <th style="width: 16%; padding: 0 4px 10px 4px; font-weight: 700; text-align: center;">MOTM</th>
                                        <th style="width: 18%; padding: 0 4px 10px 4px; font-weight: 700; text-align: right;">Prize</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.overall.rows.map((row, rIdx) => {
                                        const playerName = row[playerIdx] || '';
                                        const points = row[pointsIdx] || '';
                                        let medal = medalIdx !== -1 && row[medalIdx] !== undefined ? row[medalIdx] : '';
                                        if (!medal) {
                                            if (rIdx === 0) medal = '🥇';
                                            else if (rIdx === 1) medal = '🥈';
                                            else if (rIdx === 2) medal = '🥉';
                                        }
                                        if (rIdx === totalRows - 1 && !String(medal).includes('💩')) {
                                            medal += ' 💩';
                                        }
                                        const weeksWon = row[weeksWonIdx] !== undefined ? row[weeksWonIdx] : 0;
                                        const motm = row[motmIdx] !== undefined ? row[motmIdx] : 0;
                                        const prizeVal = row[prizeIdx] !== undefined ? row[prizeIdx] : 0;
                                        const prizeStr = String(prizeVal).startsWith('£') ? prizeVal : '£' + prizeVal;

                                        const chips = chipMap[playerName];
                                        let chipsHtml = '';
                                        if (chips) {
                                            chipsHtml = `<div class="chip-inventory">
                                                ${Object.keys(chips).map(chip => 
                                                    `<span class="chip-pill ${chips[chip] ? 'available' : ''}">${chip.toUpperCase()}</span>`
                                                ).join('')}
                                            </div>`;
                                        }

                                        return `
                                            <tr style="border-bottom: 1px solid var(--border-subtle);">
                                                <td style="width: 28%; padding: 12px 4px 12px 4px; font-weight: 600; color: #fff;">
                                                    <div>${playerName}</div>
                                                    ${chipsHtml}
                                                </td>
                                                <td style="width: 20%; padding: 12px 4px 12px 4px; font-weight: 700; color: var(--primary-color); white-space: nowrap;">${points} ${medal}</td>
                                                <td style="width: 18%; padding: 12px 4px 12px 4px; color: var(--text-color); font-weight: 500; text-align: center;">${weeksWon}</td>
                                                <td style="width: 16%; padding: 12px 4px 12px 4px; color: var(--accent-color); font-weight: 600; text-align: center;">${motm}</td>
                                                <td style="width: 18%; padding: 12px 4px 12px 4px; color: var(--text-muted); font-weight: 500; text-align: right; white-space: nowrap;">${prizeStr}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            // 3. Render Accolades Card
            if (data.accolades) {
                const acc = data.accolades;
                const formatAccoladeValue = (item, type) => {
                    if (!item || item.val === undefined || item.val === null || item.val === '') return 'N/A';
                    if (type === 'hit') return '-' + Math.abs(Number(item.val));
                    if (type === 'totalHit') return '-' + Math.abs(Number(item.val));
                    if (type === 'margin') return '+' + item.val;
                    return item.val;
                };

                html += `
                    <div class="card" style="margin-top: 24px;">
                        <div class="section-title" style="margin-bottom: 16px;">Accolades</div>
                        <ul style="list-style: none; padding: 0; margin: 0;">
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.9rem; color: #ffffff;">🔥 Highest GW Score</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${acc.highestScore ? acc.highestScore.player : 'N/A'} ${acc.highestScore && acc.highestScore.gw ? '(' + acc.highestScore.gw + ')' : ''}</div>
                                </div>
                                <span style="font-weight: 700; font-size: 1rem; color: var(--primary-color);">${formatAccoladeValue(acc.highestScore)}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.9rem; color: #ffffff;">🧊 Lowest GW Score</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${acc.lowestScore ? acc.lowestScore.player : 'N/A'} ${acc.lowestScore && acc.lowestScore.gw ? '(' + acc.lowestScore.gw + ')' : ''}</div>
                                </div>
                                <span style="font-weight: 700; font-size: 1rem; color: var(--accent-color);">${formatAccoladeValue(acc.lowestScore)}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.9rem; color: #ffffff;">⚡ Biggest Win Margin</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${acc.biggestMargin ? acc.biggestMargin.player : 'N/A'} ${acc.biggestMargin && acc.biggestMargin.gw ? '(' + acc.biggestMargin.gw + ')' : ''}</div>
                                </div>
                                <span style="font-weight: 700; font-size: 1rem; color: var(--primary-color);">${formatAccoladeValue(acc.biggestMargin, 'margin')}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.9rem; color: #ffffff;">💸 Biggest Transfer Hit</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${acc.biggestHit ? acc.biggestHit.player : 'N/A'} ${acc.biggestHit && acc.biggestHit.gw ? '(' + acc.biggestHit.gw + ')' : ''}</div>
                                </div>
                                <span style="font-weight: 700; font-size: 1rem; color: #ff4b4b;">${formatAccoladeValue(acc.biggestHit, 'hit')}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.9rem; color: #ffffff;">💸 Highest Total Transfer Cost</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${acc.highestTotalHit ? acc.highestTotalHit.player : 'N/A'}</div>
                                </div>
                                <span style="font-weight: 700; font-size: 1rem; color: #ff4b4b;">${formatAccoladeValue(acc.highestTotalHit, 'totalHit')}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0;">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.9rem; color: #ffffff;">💩 Most Weeks in Last Place</div>
                                    <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${acc.mostWeeksLast ? acc.mostWeeksLast.player : 'N/A'}</div>
                                </div>
                                <span style="font-weight: 700; font-size: 1rem; color: var(--accent-color);">${acc.mostWeeksLast ? acc.mostWeeksLast.val : 0}</span>
                            </li>
                        </ul>
                    </div>
                `;
            }

            // Last Updated Timestamp
            if (data.updated) {
                html += `<p style="text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 24px; font-weight: 500;">Last synced: ${data.updated}</p>`;
            }

            appDiv.innerHTML = html;

            const carousel = document.getElementById('period-carousel');
            if (carousel) {
                carousel.scrollLeft = carousel.scrollWidth;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTrackerData();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
