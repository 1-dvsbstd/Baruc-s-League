<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baruc's League - FPL Side Pot Tracker</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #d4af37;
            --text-color: #e0e0e0;
            --text-muted: #888888;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        /* Splash Screen Styling */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        #splash-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
            margin-bottom: 0;
            animation: none;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* App Container */
        #app {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Splash Screen Overlay -->
    <div id="splash-screen">
        <img src="splash-bg.png" alt="Loading">
    </div>

    <h1>Baruc's League</h1>
    
    <div id="app">
        <div class="loading-text">Loading tracker data...</div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbznzAi5EmRvb6uHfp898c4T0eGxWGDWu16AccyUfsXqU7M4e5az-Hwp9szBP1W_J97MPg/exec';

        async function loadTrackerData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                renderApp(data);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('app').innerHTML = `
                    <div class="card">
                        <p style="color: #ff6b6b; text-align: center;">Unable to load data. Please check your connection.</p>
                    `;
            } finally {
                // Dismiss splash screen smoothly once loaded
                const splash = document.getElementById('splash-screen');
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 500);
            }
        }

        function renderApp(data) {
            const appDiv = document.getElementById('app');
            let html = '';

            // Render Monthly / Period Breakdowns First
            if (data.monthly && data.monthly.length > 0) {
                html += `<h3 style="color: var(--primary-color); text-align: center; margin: 0 0 12px 0;">Periods & Monthly</h3>`;
                
                data.monthly.forEach(period => {
                    // Clean up title by removing "Period X " if it follows the "Period X (GW...)" pattern
                    let cleanTitle = period.title.replace(/^Period\s+\d+\s*\(([^)]+)\)/i, '$1');

                    html += `
                        <div class="card">
                            <h4 style="margin-top: 0; color: var(--text-color); border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">${cleanTitle}</h4>
                            <ul style="list-style: none; padding: 0; margin: 0 0 12px 0;">
                                ${period.scores.map(s => `
                                    <li style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.02);">
                                        <span>${s.name}</span>
                                        <span style="font-weight: bold; color: var(--primary-color);">${s.score}</span>
                                    </li>
                                `).join('')}
                            </ul>
                            <div style="font-size: 0.85rem; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px;">
                                <div>🏆 <strong>Winner:</strong> ${period.topScorer} (${period.winnerPrize})</div>
                                <div>🥈 <strong>Runner-up:</strong> ${period.runnerName} (${period.runnerPrize})</div>
                                ${period.lastScorer ? `<div>💩 <strong>Last Place:</strong> ${period.lastScorer}</div>` : ''}
                            </div>
                        </div>
                    `;
                });
            }

            // Render Overall Standings Table at the Bottom
            if (data.overall && data.overall.rows) {
                html += `
                    <div class="card" style="margin-top: 24px;">
                        <h3 style="color: var(--primary-color); margin-top: 0; text-align: center;">Overall Standings</h3>
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
                                <thead>
                                    <tr style="border-bottom: 1px solid var(--border-color); color: var(--text-muted);">
                                        ${data.overall.headers.map(h => `<th style="padding: 8px 4px;">${h}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.overall.rows.map(row => `
                                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                                            ${row.map(cell => `<td style="padding: 10px 4px;">${cell}</td>`).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            // Last Updated Timestamp
            if (data.updated) {
                html += `<p style="text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 20px;">Last synced: ${data.updated}</p>`;
            }

            appDiv.innerHTML = html;
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            loadTrackerData();
        });

        // Register Service Worker for PWA functionality if available
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
