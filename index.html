<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL League Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #12071f;
            --card-bg: #1c0b30;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-green: #00ff87;
            --accent-cyan: #00e5ff;
            --gold-color: #ffd700;
            --text-main: #ffffff;
            --text-muted: #a090b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Section Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .section-title {
            color: var(--accent-green);
            font-size: 1.15rem;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 14px;
        }

        /* Overall Standings Table */
        .standings-table {
            width: 100%;
            border-collapse: collapse;
        }

        .standings-table th {
            color: var(--accent-cyan);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .standings-table td {
            padding: 10px 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .standings-table tr:last-child td {
            border-bottom: none;
        }

        .manager-name {
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
        }

        /* SINGLE-LINE HORIZONTAL CHIP PILLS (Option 1) */
        .chip-inventory {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
            width: 100%;
        }

        .chip-pill {
            font-size: 0.55rem;
            font-weight: 800;
            padding: 4px 0;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #c4b8d9;
            text-align: center;
            box-sizing: border-box;
            line-height: 1;
            flex: 1;
            max-width: 26px;
        }

        .chip-pill.active {
            color: var(--gold-color);
            border-color: var(--gold-color);
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 4px rgba(255, 215, 0, 0.35);
        }

        .chip-pill.used {
            color: #554868;
            border-color: rgba(255, 255, 255, 0.04);
            text-decoration: line-through;
            opacity: 0.4;
        }

        .pts-cell {
            font-weight: 800;
            color: var(--accent-green);
            text-align: center;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .prize-cell {
            text-align: right;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* Accolades Styling */
        .accolade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .accolade-item:last-child {
            border-bottom: none;
        }

        .accolade-label {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .accolade-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .accolade-val {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .last-updated {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Overall Standings Card -->
        <div class="card">
            <h2 class="section-title">Overall Standings</h2>
            <table class="standings-table">
                <thead>
                    <tr>
                        <th style="width: 28%; text-align: left;">Manager</th>
                        <th style="width: 34%; text-align: center;">Chips</th>
                        <th style="width: 22%; text-align: center;">Points</th>
                        <th style="width: 16%; text-align: right;">Prize</th>
                    </tr>
                </thead>
                <tbody id="overallStandingsBody">
                    <!-- Dynamic Rows Render Here -->
                </tbody>
            </table>
        </div>

        <!-- Accolades Card -->
        <div class="card">
            <h2 class="section-title">Accolades</h2>
            <div id="accoladesContainer">
                <!-- Dynamic Accolades Render Here -->
            </div>
        </div>

        <div id="updatedTime" class="last-updated">Updating...</div>
    </div>

    <script>
        // PASTE YOUR APPS SCRIPT WEB APP URL HERE
        const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';

        const CHIP_LIST = [
            { id: 'wildcard', label: 'WC' },
            { id: 'freehit', label: 'FH' },
            { id: 'bboost', label: 'BB' },
            { id: '3c', label: 'TC' }
        ];

        async function loadTrackerData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                renderOverallStandings(data);
                renderAccolades(data.accolades);

                if (data.updated) {
                    document.getElementById('updatedTime').innerText = 'Last Sync: ' + data.updated;
                }
            } catch (err) {
                console.error('Error fetching data:', err);
            }
        }

        function renderOverallStandings(data) {
            const tbody = document.getElementById('overallStandingsBody');
            tbody.innerHTML = '';

            if (!data.overall || !data.overall.rows) return;

            // Map live remaining chips if available from live standings backend payload
            const chipMap = {};
            if (data.standings) {
                data.standings.forEach(s => {
                    chipMap[s.managerName.toLowerCase()] = s.remainingChips;
                });
            }

            data.overall.rows.forEach((row, idx) => {
                const managerName = row[0] || '';
                const totalPoints = row[1] || 0;
                const prizeMoney = row[2] || '£0';
                
                // Add position emoji badge to points
                let badge = '';
                if (idx === 0) badge = ' 🥇';
                else if (idx === 1) badge = ' 🥈';
                else if (idx === 2) badge = ' 🥉';
                else if (idx === data.overall.rows.length - 1) badge = ' 💩';

                const mgrKey = managerName.trim().toLowerCase();
                const managerChips = chipMap[mgrKey] || { wildcard: true, freehit: true, bboost: true, '3c': true };

                // Build 1x4 horizontal flex pills
                let chipsHtml = '<div class="chip-inventory">';
                CHIP_LIST.forEach(chip => {
                    const isAvailable = managerChips[chip.id];
                    const statusClass = isAvailable ? '' : 'used';
                    chipsHtml += `<div class="chip-pill ${statusClass}">${chip.label}</div>`;
                });
                chipsHtml += '</div>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="manager-name">${managerName}</td>
                    <td>${chipsHtml}</td>
                    <td class="pts-cell">${totalPoints}${badge}</td>
                    <td class="prize-cell">${prizeMoney}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderAccolades(acc) {
            if (!acc) return;
            const container = document.getElementById('accoladesContainer');
            
            const list = [
                { icon: '🔥', title: 'Highest GW Score', item: acc.highestScore },
                { icon: '🧊', title: 'Lowest GW Score', item: acc.lowestScore },
                { icon: '📐', title: 'Biggest Victory Margin', item: acc.biggestMargin },
                { icon: '💥', title: 'Biggest Single Hit', item: acc.biggestHit, suffix: ' pts' },
                { icon: '💸', title: 'Most Hit Points Lost', item: acc.highestTotalHit, suffix: ' pts' },
                { icon: '🔄', title: 'Most Transfers Made', item: acc.mostTransfers }
            ];

            let html = '';
            list.forEach(row => {
                if (!row.item) return;
                const valDisplay = (row.item.val !== undefined && row.item.val !== -1 && row.item.val !== 999) 
                    ? row.item.val + (row.suffix || '') 
                    : '-';
                const subDisplay = row.item.gw ? `${row.item.player} (${row.item.gw})` : (row.item.player || '');

                html += `
                    <div class="accolade-item">
                        <div>
                            <div class="accolade-label">${row.icon} ${row.title}</div>
                            <div class="accolade-sub">${subDisplay}</div>
                        </div>
                        <div class="accolade-val">${valDisplay}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        loadTrackerData();
    </script>
</body>
</html>
