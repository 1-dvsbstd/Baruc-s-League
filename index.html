<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baruc's League - FPL Side Pot Tracker</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #d4af37;
            --text-color: #e0e0e0;
            --text-muted: #888888;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        /* Splash Screen Styling */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        #splash-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
            margin-bottom: 0;
            animation: none;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* App Container */
        #app {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Splash Screen Overlay -->
    <div id="splash-screen">
        <img src="splash-bg.png" alt="Loading">
    </div>

    <h1>Baruc's League</h1>
    
    <div id="app">
        <div class="loading-text">Loading tracker data...</div>
    </div>

    <script>
        // Replace with your actual Google Apps Script Web App URL
        const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

        async function loadTrackerData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                renderApp(data);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('app').innerHTML = `
                    <div class="card">
                        <p style="color: #ff6b6b; text-align: center;">Unable to load data. Please check your connection.</p>
                    </div>`;
            } finally {
                // Dismiss splash screen smoothly once loaded
                const splash = document.getElementById('splash-screen');
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 500);
            }
        }

        function renderApp(data) {
            const appDiv = document.getElementById('app');
            // Basic rendering placeholder - customize based on your JSON structure
            appDiv.innerHTML = `
                <div class="card">
                    <h3>Tracker Active</h3>
                    <p>Connected to backend successfully.</p>
                </div>`;
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            loadTrackerData();
        });

        // Register Service Worker for PWA functionality if available
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Service Worker registration failed:', err));
        }
    </script>
</body>
</html>
