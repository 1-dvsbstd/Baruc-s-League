<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Baruc's League - FPL Side Pot Tracker</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#070b12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        (() => {
            const previewTheme = new URLSearchParams(window.location.search).get('theme');
            const allowedThemes = ['royal', 'stadium', 'burgundy'];
            if (allowedThemes.includes(previewTheme)) {
                document.documentElement.dataset.theme = previewTheme;
            }
        })();
    </script>

    <style>
        :root {
            --surface-color: #070b12;       /* Stadium-night navy */
            --card-bg: #111a28;             /* Floodlit slate card */
            --card-border: rgba(255, 255, 255, 0.09); /* Subtle glass edge */
            --primary-color: #00ff87;        /* FPL Green - RESERVED FOR KEY STATS */
            --accent-color: #d2b06f;         /* Aged trophy brass */
            --ice-blue: #bdcbd8;             /* Floodlight silver-blue */
            --text-color: #f3ede2;           /* Warm stadium ivory */
            --text-muted: #adb9c8;           /* Slate supporting copy */
            --text-warm: #e1c28b;            /* Trophy-room champagne */
            --text-violet: #91a3b8;          /* Steel-blue tertiary labels */
            --border-subtle: rgba(255, 255, 255, 0.06);
            --danger-color: #ff4b4b;        /* Crisp red for hits & low ranks */
            --gold-color: #ffc72c;          /* Refined gold for winners & 1st place */
            --silver-color: #d1d5db;        /* Metallic silver for runner-up prizes */
            --rank-gold-edge: rgba(255, 199, 44, 0.78);
            --rank-silver-edge: rgba(226, 232, 240, 0.72);
        }

        /* Optional palette previews. Rank and prize colours stay unchanged. */
        :root[data-theme="royal"] {
            --surface-color: #09070d;
            --card-bg: #1b1120;
            --accent-color: #b98a43;
            --ice-blue: #bbb5b0;
            --text-color: #f0e7d9;
            --text-muted: #aaa3aa;
            --text-warm: #d5b274;
            --text-violet: #918893;
        }

        :root[data-theme="stadium"] {
            --surface-color: #070b12;
            --card-bg: #111a28;
            --accent-color: #d2b06f;
            --ice-blue: #bdcbd8;
            --text-color: #f3ede2;
            --text-muted: #adb9c8;
            --text-warm: #e1c28b;
            --text-violet: #91a3b8;
        }

        :root[data-theme="burgundy"] {
            --surface-color: #12080d;
            --card-bg: #2a101c;
            --accent-color: #d4a06f;
            --ice-blue: #d8c5cd;
            --text-color: #f5e9df;
            --text-muted: #cbb3bd;
            --text-warm: #e6c092;
            --text-violet: #bd879d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--surface-color);
            background-image:
                linear-gradient(180deg, rgba(7, 4, 18, 0.12) 0%, rgba(14, 3, 24, 0.22) 52%, rgba(7, 4, 18, 0.38) 100%),
                url('page-bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 24px 14px;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 4px 0;
            text-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }

        .update-timestamp {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .data-status-notice {
            display: none;
            margin: 0 auto 14px;
            padding: 8px 11px;
            border: 1px solid rgba(210, 176, 111, 0.42);
            border-radius: 8px;
            background: rgba(35, 27, 13, 0.82);
            color: var(--text-warm);
            font-size: 0.68rem;
            font-weight: 700;
            line-height: 1.35;
            text-align: center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 5px 16px rgba(0,0,0,0.18);
        }

        .data-status-notice.visible { display: block; }

        /* Splash Screen Styling */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--surface-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease-out;
        }

        #splash-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* App Container */
        #app {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Glassmorphic Cards */
        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.15) 100%), var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px 14px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }

        /* Section Headings */
        .section-title {
            color: var(--text-color);
            text-align: center;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0 0 14px 0;
            opacity: 0.9;
        }

        /* GW Cards & Dropdowns */
        .fut-card {
            position: relative;
            cursor: pointer;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.15) 100%), var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            user-select: none;
        }
        
        .fut-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .fut-card.glow-gold {
            border: 1.5px solid var(--gold-color) !important;
            box-shadow: 0 0 16px rgba(255, 199, 44, 0.25), inset 0 0 12px rgba(255, 199, 44, 0.1);
        }

        .chip-badge {
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 4px;
            margin-left: 8px;
            text-transform: uppercase;
            background: var(--gold-color);
            color: #12041f;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .card-dropdown {
            margin-top: 12px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 10px;
            font-size: 0.85rem;
            display: none;
        }

        .fut-card.expanded .card-dropdown {
            display: block;
        }

        /* Standings Chip Inventory Pills */
        .chip-inventory {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
            width: 100%;
        }
        
        .chip-pill {
            font-size: 0.58rem;
            font-weight: 700;
            padding: 3px 0;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            text-align: center;
            box-sizing: border-box;
            flex: 1;
            min-width: 0;
            line-height: 1.1;
        }
        
        .chip-pill.active {
            color: var(--gold-color);
            border-color: var(--gold-color);
            background: rgba(7, 22, 55, 0.58);
            box-shadow: 0 0 9px rgba(255, 199, 44, 0.30), inset 0 0 8px rgba(255, 199, 44, 0.10), inset 0 1px 0 rgba(255,255,255,0.12);
            text-shadow: 0 0 7px rgba(255, 199, 44, 0.36);
            opacity: 1;
        }

        .chip-pill.available {
            color: rgba(189, 203, 216, 0.64);
            border-color: rgba(189, 203, 216, 0.14);
            background: rgba(5, 9, 16, 0.32);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.38);
            opacity: 0.72;
        }
        
        .chip-pill.used {
            color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.03);
            background: transparent;
            text-decoration: line-through;
            opacity: 0.5;
        }

        /* Carousel Component Styling */
        .carousel-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 16px;
            padding-bottom: 8px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-card {
            min-width: 100%;
            box-sizing: border-box;
            scroll-snap-align: start;
        }

        /* GW Carousel Header Controls */
        .gw-carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 2px;
        }
        .carousel-nav-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .carousel-nav-btn:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }
        .carousel-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        /* Badges */
        .badge-live {
            background: rgba(0, 255, 135, 0.13);
            color: var(--primary-color);
            border: 1px solid rgba(0, 255, 135, 0.38);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .badge-live::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        .badge-final {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .badge-deadline {
            background: rgba(197, 164, 210, 0.10);
            color: var(--ice-blue);
            border: 1px solid rgba(197, 164, 210, 0.28);
            padding: 3px 7px;
            border-radius: 6px;
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.35px;
            white-space: nowrap;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .dot.active {
            width: 18px;
            border-radius: 4px;
            background-color: var(--primary-color);
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-weight: 500;
        }

        /* FUT-inspired Gameweek Experience */
        .gw-carousel-header {
            position: relative;
            top: auto;
            z-index: 1;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(14, 3, 24, 0.92);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(14px);
        }

        .gw-title-stack {
            min-width: 110px;
            text-align: center;
        }

        .gw-title {
            color: #fff;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .gw-status {
            min-height: 22px;
            margin-top: 4px;
            display: flex;
            justify-content: center;
        }

        .gw-progress {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            min-height: 12px;
            margin: -4px 0 12px;
        }

        .gw-progress-dot {
            width: 6px;
            height: 6px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.38);
            cursor: pointer;
            transition: width 0.2s ease, background 0.2s ease, opacity 0.2s ease;
        }

        .gw-progress-dot.active {
            width: 20px;
            border-radius: 5px;
            background: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.3);
        }

        .gw-progress-dot.is-hidden {
            display: none;
        }

        .manager-item {
            --item-accent: rgba(255, 255, 255, 0.13);
            position: relative;
            overflow: visible;
            z-index: 1;
            border: 2px solid var(--item-accent) !important;
            padding: 12px 14px;
            margin-bottom: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            outline: none;
            background-color: #160b1f;
            background:
                linear-gradient(115deg, rgba(255,255,255,0.035), transparent 30%),
                linear-gradient(145deg, #22122d, #160b1f);
        }

        .manager-item:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 3px;
        }

        .manager-glow-wrap {
            position: relative;
            isolation: isolate;
            margin-bottom: 8px;
        }

        .manager-item * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .manager-item::selection,
        .manager-item *::selection {
            background: transparent;
        }

        .manager-item::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            opacity: 0.2;
            background-image:
                linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.16) 49%, transparent 57%),
                repeating-linear-gradient(135deg, transparent 0 18px, rgba(255,255,255,0.035) 18px 19px);
        }

        .manager-item.rank-card-1 {
            --item-accent: var(--rank-gold-edge);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(255, 199, 44, 0.08), 0 0 26px rgba(255, 199, 44, 0.14), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-item.rank-card-2 {
            --item-accent: var(--rank-silver-edge);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(226, 232, 240, 0.12), 0 0 24px rgba(226, 232, 240, 0.13), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-item.rank-card-3 {
            --item-accent: rgba(178, 103, 57, 0.58);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(178, 103, 57, 0.08), 0 0 22px rgba(178, 103, 57, 0.1), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-item.rank-card-4 {
            --item-accent: rgba(169, 61, 85, 0.34);
            background: linear-gradient(145deg, #22122d, #160b1f);
            box-shadow: 0 0 0 1px rgba(169, 61, 85, 0.07), 0 0 22px rgba(169, 61, 85, 0.1), 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .manager-item.rank-card-1 .manager-score-value { color: var(--gold-color); }
        .manager-item.rank-card-2 .manager-score-value { color: var(--silver-color); }
        .manager-item.rank-card-3 .manager-score-value { color: #a86f46; }
        .manager-item.rank-card-4 .manager-score-value { color: #9a5968; }

        .manager-glow-wrap.transfer-positive::before,
        .manager-glow-wrap.transfer-negative::before {
            content: '';
            display: block;
            position: absolute;
            top: 27%;
            right: -12px;
            bottom: 27%;
            left: -12px;
            z-index: 0;
            pointer-events: none;
            filter: blur(10px);
        }

        .manager-glow-wrap.transfer-positive::before {
            background: linear-gradient(90deg, rgba(20, 255, 118, 0.34) 0, transparent 13%, transparent 87%, rgba(20, 255, 118, 0.34) 100%);
        }

        .manager-glow-wrap.transfer-negative::before {
            background: linear-gradient(90deg, rgba(255, 24, 48, 0.38) 0, transparent 13%, transparent 87%, rgba(255, 24, 48, 0.38) 100%);
        }

        .manager-item.glow-gold {
            border-color: var(--rank-gold-edge) !important;
            background:
                radial-gradient(circle at 50% -30%, rgba(255,199,44,0.42) 0%, rgba(255,199,44,0.13) 24%, transparent 46%),
                linear-gradient(115deg, transparent 0 13%, rgba(255,199,44,0.10) 13.5% 14.5%, transparent 15% 84%, rgba(255,199,44,0.10) 84.5% 85.5%, transparent 86%),
                linear-gradient(145deg, #071637, #0b3274 52%, #07132f);
            box-shadow: 0 0 34px rgba(36, 112, 219, 0.36), 0 0 20px rgba(255, 199, 44, 0.22), inset 0 0 30px rgba(32, 104, 202, 0.22), inset 0 1px 0 rgba(255,238,178,0.30);
        }

        .manager-item.glow-gold::before {
            opacity: 1;
            background:
                conic-gradient(from 45deg at 50% 48%, transparent 0 10%, rgba(255,215,90,0.055) 10% 12%, transparent 12% 23%, rgba(255,255,255,0.035) 23% 25%, transparent 25% 100%),
                radial-gradient(circle at 50% 50%, rgba(104,174,255,0.12), transparent 45%);
        }

        .manager-item.glow-gold::after {
            content: '';
            position: absolute;
            inset: 5px;
            z-index: 0;
            border: 1px solid rgba(255, 199, 44, 0.30);
            border-radius: 9px;
            background: linear-gradient(120deg, rgba(255,199,44,0.06), transparent 32%, rgba(255,199,44,0.025) 62%, transparent);
            pointer-events: none;
        }

        .manager-item.glow-gold > * { position: relative; z-index: 1; }

        .manager-summary {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
        }

        .manager-rank {
            width: 38px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid color-mix(in srgb, var(--item-accent) 72%, transparent);
            background: rgba(0, 0, 0, 0.24);
            clip-path: polygon(18% 0, 100% 0, 100% 82%, 82% 100%, 0 100%, 0 18%);
            color: var(--item-accent);
            font-size: 1.3rem;
            font-weight: 900;
        }

        .manager-name {
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
        }

        .manager-team {
            color: var(--text-muted);
            font-size: 0.72rem;
            margin-top: 2px;
        }

        .manager-overall {
            color: var(--text-muted);
            font-size: 0.66rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .rank-up { color: var(--primary-color); }
        .rank-down { color: var(--danger-color); }
        .rank-level { color: var(--text-muted); }

        .standing-points-wrap {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            white-space: nowrap;
        }

        .standing-movement {
            min-width: 0;
            font-size: 0.68rem;
            font-weight: 850;
            line-height: 1;
            text-align: left;
        }

        .manager-score {
            text-align: right;
        }

        .compact-overall {
            margin-top: 7px;
            color: #fff;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.03em;
        }

        .score-metrics {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .score-metric + .score-metric {
            padding-left: 12px;
            border-left: 1px solid rgba(255, 255, 255, 0.12);
        }

        .average-value {
            color: var(--text-muted);
        }

        .manager-score-value {
            color: #fff;
            font-size: 1.35rem;
            font-weight: 900;
            line-height: 1;
        }

        .manager-score-label {
            color: var(--text-violet);
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-top: 5px;
        }

        .players-left {
            margin-top: 4px;
            color: var(--accent-color);
            font-size: 0.58rem;
            font-weight: 850;
            white-space: nowrap;
        }

        .chip-slot {
            display: inline-flex;
            align-items: center;
            min-height: 18px;
            margin-top: 5px;
            padding: 2px 7px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.16);
            font-size: 0.56rem;
            font-weight: 800;
            letter-spacing: 0.08em;

            visibility: hidden;
            pointer-events: none;
        }

        @media (min-width: 700px) {
            body {
                background-size: 920px auto;
                background-position: center 35%;
            }
        }

        .period-carousel-title {
            color: #fff;
            font-size: 0.9rem;
            font-weight: 800;
            text-align: center;
        }

        @media (max-width: 430px) {
            body { padding: 14px 10px; }
            h1 { font-size: 1.35rem; margin-bottom: 12px; }
            .manager-item { padding: 9px 12px; margin-bottom: 0; }
            .manager-glow-wrap { margin-bottom: 7px; }
            .manager-name { font-size: 0.92rem; }
            .manager-team { font-size: 0.67rem; }
            .chip-slot { min-height: 17px; margin-top: 4px; padding: 1px 6px; }
            .form-row { margin-top: 7px; padding-top: 7px; }
            .form-position { width: 21px; height: 21px; }
            .detail-grid { grid-template-columns: 1fr; }
            .manager-summary { grid-template-columns: 1fr auto; gap: 8px; }
