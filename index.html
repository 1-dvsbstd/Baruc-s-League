<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Baruc's League - FPL Side Pot Tracker</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0e0318">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --surface-color: #0e0318;       /* Deeper obsidian-purple background */
            --card-bg: #1c092d;             /* Rich plum card container */
            --card-border: rgba(255, 255, 255, 0.09); /* Subtle glass edge */
            --primary-color: #00ff87;        /* FPL Green - RESERVED FOR KEY STATS */
            --accent-color: #00f5ff;         /* Cyan accent for secondary elements */
            --ice-blue: #80d4ff;             /* Ice blue for cold/low stats */
            --text-color: #ffffff;           /* Clean white headers & names */
            --text-muted: #bdaecf;          /* High-legibility lavender subtext */
            --border-subtle: rgba(255, 255, 255, 0.06);
            --danger-color: #ff4b4b;        /* Crisp red for hits & low ranks */
            --gold-color: #ffc72c;          /* Refined gold for winners & 1st place */
            --silver-color: #d1d5db;        /* Metallic silver for runner-up prizes */
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--surface-color);
            background-image: radial-gradient(circle at 50% 0%, #2a0943 0%, #0e0318 75%);
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 24px 14px;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 4px 0;
            text-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }

        .update-timestamp {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        /* Splash Screen Styling */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--surface-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease-out;
        }

        #splash-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* App Container */
        #app {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Glassmorphic Cards */
        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.15) 100%), var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px 14px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }

        /* Section Headings */
        .section-title {
            color: var(--text-color);
            text-align: center;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: 0 0 14px 0;
            opacity: 0.9;
        }

        /* GW Cards & Dropdowns */
        .fut-card {
            position: relative;
            cursor: pointer;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.15) 100%), var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            user-select: none;
        }
        
        .fut-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .fut-card.glow-gold {
            border: 1.5px solid var(--gold-color) !important;
            box-shadow: 0 0 16px rgba(255, 199, 44, 0.25), inset 0 0 12px rgba(255, 199, 44, 0.1);
        }

        .chip-badge {
            font-size: 0.62rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 4px;
            margin-left: 8px;
            text-transform: uppercase;
            background: var(--gold-color);
            color: #12041f;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .card-dropdown {
            margin-top: 12px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 10px;
            font-size: 0.85rem;
            display: none;
        }

        .fut-card.expanded .card-dropdown {
            display: block;
        }

        /* Standings Chip Inventory Pills */
        .chip-inventory {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
            width: 100%;
        }
        
        .chip-pill {
            font-size: 0.58rem;
            font-weight: 700;
            padding: 3px 0;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            text-align: center;
            box-sizing: border-box;
            flex: 1;
            min-width: 0;
            line-height: 1.1;
        }
        
        .chip-pill.active {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background: rgba(0, 255, 135, 0.15);
            box-shadow: 0 0 6px rgba(0, 255, 135, 0.3);
        }
        
        .chip-pill.used {
            color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.03);
            background: transparent;
            text-decoration: line-through;
            opacity: 0.5;
        }

        /* Carousel Component Styling */
        .carousel-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 16px;
            padding-bottom: 8px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        .carousel-card {
            min-width: 100%;
            box-sizing: border-box;
            scroll-snap-align: start;
        }

        /* GW Carousel Header Controls */
        .gw-carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 2px;
        }
        .carousel-nav-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }
        .carousel-nav-btn:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }
        .carousel-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        /* Badges */
        .badge-live {
            background: rgba(255, 75, 75, 0.15);
            color: #ff4b4b;
            border: 1px solid rgba(255, 75, 75, 0.4);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .badge-live::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #ff4b4b;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        .badge-final {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .dot.active {
            width: 18px;
            border-radius: 4px;
            background-color: var(--primary-color);
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Splash Screen Overlay -->
    <div id="splash-screen">
        <img src="splash-bg.png" alt="Loading" onerror="this.parentElement.style.display='none'">
    </div>

    <h1>Baruc's League</h1>
    <div id="timestamp" class="update-timestamp"></div>
    
    <div id="app">
        <div class="loading-text">Loading tracker data...</div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVQrIeCr5DL5HRBBH13eycceCb7l8VD0X3YnX3ZB0v321OBMAsSLCw5fgChvTQl8Emaw/exec';

        const TEAM_NAMES = {
            "Nathan": "nr xi",
            "Mike": "mikes marauders",
            "Carl": "Ginger Ninjas",
            "Charlie": "Oakley1"
        };

        let currentGwSlideIdx = 0;
        let totalGwSlides = 0;
        let gwDataStore = [];

        function hideSplash() {
            const splash = document.getElementById('splash-screen');
            if (splash && !splash.classList.contains('fade-out')) {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 400);
            }
        }

        function getChipDisplayName(chipKey) {
            if (!chipKey) return '';
            const s = String(chipKey).toLowerCase();
            if (s.includes('wildcard') || s === 'wc') return 'WILDCARD';
            if (s.includes('free') || s === 'fh') return 'FREE HIT';
            if (s.includes('bboost') || s.includes('bench') || s === 'bb') return 'BENCH BOOST';
            if (s.includes('3c') || s.includes('3xc') || s.includes('triple') || s === 'tc') return 'TRIPLE CAPTAIN';
            return chipKey.toUpperCase();
        }

        function renderChipsHtml(chipsData, activeChip) {
            const standardChips = [
                { id: 'wc', label: 'WC' },
                { id: 'fh', label: 'FH' },
                { id: 'bb', label: 'BB' },
                { id: 'tc', label: 'TC' }
            ];

            const normalize = (name) => {
                if (!name) return '';
                const s = String(name).toLowerCase();
                if (s.includes('wildcard') || s === 'wc') return 'wc';
                if (s.includes('free') || s === 'fh') return 'fh';
                if (s.includes('bboost') || s.includes('bench') || s === 'bb') return 'bb';
                if (s.includes('3c') || s.includes('3xc') || s.includes('triple') || s === 'tc') return 'tc';
                return s;
            };

            const activeNorm = normalize(activeChip);

            const statusMap = {};
            if (chipsData && typeof chipsData === 'object') {
                Object.keys(chipsData).forEach(k => {
                    const normKey = normalize(k);
                    const val = chipsData[k];
                    if (val === false || val === 'used') statusMap[normKey] = 'used';
                    else if (val === true || val === 'available') statusMap[normKey] = 'available';
                });
            }

            return `<div class="chip-inventory">` + standardChips.map(chip => {
                let state = 'available';

                if (activeNorm === chip.id) {
                    state = 'active';
                } else if (statusMap[chip.id] === 'used') {
                    state = 'used';
                }

                return `<span class="chip-pill ${state}">${chip.label}</span>`;
            }).join('') + `</div>`;
        }

        function formatTransfers(rawText, hits) {
            if (!rawText || rawText === 'None') {
                return hits && hits > 0 ? `(-${hits} pts hit)` : 'None';
            }
            const ins = [];
            const outs = [];
            const inMatches = rawText.match(/In:\s*([^,\/]+)/gi);
            const outMatches = rawText.match(/Out:\s*([^,\/]+)/gi);
            
            if (inMatches) {
                inMatches.forEach(m => {
                    const name = m.replace(/In:\s*/i, '').trim();
                    if (name && !ins.includes(name)) ins.push(name);
                });
            }
            if (outMatches) {
                outMatches.forEach(m => {
                    const name = m.replace(/Out:\s*/i, '').trim();
                    if (name && !outs.includes(name)) outs.push(name);
                });
            }
            
            if (ins.length === 0 && outs.length === 0) {
                let res = String(rawText);
                if (hits && hits > 0 && !res.includes('pt')) res += ` (-${hits} pts)`;
                return res;
            }
            
            let resultParts = [];
            if (ins.length > 0) resultParts.push(`In: ${ins.join(', ')}`);
            if (outs.length > 0) resultParts.push(`Out: ${outs.join(', ')}`);
            
            let finalStr = resultParts.join(' | ');
            if (hits && hits > 0 && !finalStr.includes('pt')) {
                finalStr += ` (-${hits} pts)`;
            }
            return finalStr;
        }

        async function loadTrackerData() {
            const safetyTimer = setTimeout(() => {
                hideSplash();
            }, 5000);

            try {
                const separator = SCRIPT_URL.includes('?') ? '&' : '?';
                const response = await fetch(`${SCRIPT_URL}${separator}_=${Date.now()}`, {
                    cache: 'no-store'
                });
                if (!response.ok) {
                    throw new Error(`Tracker request failed with HTTP ${response.status}`);
                }
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                clearTimeout(safetyTimer);
                if (data.updated) {
                    document.getElementById('timestamp').innerText = `Updated: ${data.updated}`;
                }
                renderApp(data);
            } catch (error) {
                clearTimeout(safetyTimer);
                console.error('Error fetching data:', error);
                document.getElementById('app').innerHTML = `
                    <div class="card">
                        <p style="color: var(--danger-color); text-align: center; font-weight: 500;">Unable to load data. Please check your connection or Apps Script deployment.</p>
                    </div>`;
            } finally {
                hideSplash();
            }
        }

        function renderApp(data) {
            const appDiv = document.getElementById('app');
            let html = '';

            // 1. Gameweek Tracker Carousel Parsing with Deduplication
            gwDataStore = [];
            let rawGwStore = [];
            if (data.gameweeks && Array.isArray(data.gameweeks) && data.gameweeks.length > 0) {
                rawGwStore = data.gameweeks;
            } else {
                const legacyStandings = data.standings || (data.liveData ? data.liveData.standings : []);
                const legacyGw = data.gameweek || (data.liveData ? data.liveData.gameweek : 1);
                if (legacyStandings.length > 0) {
                    rawGwStore = [{
                        gameweek: legacyGw,
                        isLive: true,
                        standings: legacyStandings
                    }];
                }
            }

            // Deduplicate gameweeks by GW number to prevent duplicates
            const seenGws = new Set();
            rawGwStore.forEach(gw => {
                const gwNum = gw.gameweek !== undefined ? Number(gw.gameweek) : (gw.gw !== undefined ? Number(gw.gw) : null);
                if (gwNum !== null) {
                    if (!seenGws.has(gwNum)) {
                        seenGws.add(gwNum);
                        gwDataStore.push(gw);
                    }
                } else {
                    gwDataStore.push(gw);
                }
            });
            gwDataStore.sort((a, b) => (Number(a.gameweek || a.gw || 0)) - (Number(b.gameweek || b.gw || 0)));

            if (gwDataStore.length > 0) {
                totalGwSlides = gwDataStore.length;
                html += `<div class="section-title">Gameweek Tracker</div>`;
                
                html += `
                    <div class="gw-carousel-header">
                        <button id="prevGwBtn" class="carousel-nav-btn" onclick="moveGwSlide(-1)">‹ Prev</button>
                        <div id="gwSlideTitle" style="font-weight: 700; font-size: 0.9rem; color: var(--text-color); display: flex; align-items: center; gap: 8px;"></div>
                        <button id="nextGwBtn" class="carousel-nav-btn" onclick="moveGwSlide(1)">Next ›</button>
                    </div>

                    <div class="carousel-container" id="gw-carousel-track" style="margin-bottom: 24px;">
                `;

                gwDataStore.forEach((gwGroup, gwIdx) => {
                    const standings = gwGroup.standings || [];
                    standings.sort((a, b) => {
                        const pA = a.netPoints !== undefined ? a.netPoints : (a.livePoints !== undefined ? a.livePoints : 0);
                        const pB = b.netPoints !== undefined ? b.netPoints : (b.livePoints !== undefined ? b.livePoints : 0);
                        return pB - pA;
                    });

                    html += `<div class="carousel-card" id="gw-slide-${gwIdx}">`;

                    standings.forEach(mgr => {
                        const managerName = mgr.managerName || mgr.name || '';
                        const teamName = mgr.teamName || TEAM_NAMES[managerName] || '';
                        const hasActiveChip = mgr.activeChip !== null && mgr.activeChip !== undefined && mgr.activeChip !== '' && mgr.activeChip !== 'None';
                        const cardClass = hasActiveChip ? 'fut-card glow-gold' : 'fut-card';
                        const chipLabel = getChipDisplayName(mgr.activeChip || mgr.chipDisplay);

                        // Robustly resolve Star Performer data
                        const getPerformer = (m, keys) => {
                            for (let k of keys) {
                                if (m[k] !== undefined && m[k] !== null && m[k] !== '' && m[k] !== 'None') {
                                    return m[k];
                                }
                            }
                            return null;
                        };

                        const starObj = getPerformer(mgr, ['starPerformer', 'star', 'star_name', 'bestPerformer']);
                        const worstObj = getPerformer(mgr, ['worstPerformer', 'worst', 'worst_name', 'worstPlayer']);

                        const starName = starObj ? (typeof starObj === 'object' ? (starObj.name || starObj.player || starObj.playerName || 'None') : starObj) : null;
                        const starPts = starObj && typeof starObj === 'object' ? (starObj.points !== undefined ? starObj.points : (starObj.pts !== undefined ? starObj.pts : 0)) : 0;
                        
                        const worstName = worstObj ? (typeof worstObj === 'object' ? (worstObj.name || worstObj.player || worstObj.playerName || 'None') : worstObj) : null;
                        const worstPts = worstObj && typeof worstObj === 'object' ? (worstObj.points !== undefined ? worstObj.points : (worstObj.pts !== undefined ? worstObj.pts : 0)) : 0;

                        const pointsDisplay = mgr.netPoints !== undefined ? mgr.netPoints : (mgr.livePoints !== undefined ? mgr.livePoints : 0);

                        let rawTransfers = 'None';
                        if (mgr.transfersText && mgr.transfersText !== 'None') {
                            rawTransfers = String(mgr.transfersText);
                        } else if (mgr.transfers) {
                            if (Array.isArray(mgr.transfers)) {
                                rawTransfers = mgr.transfers.length > 0 ? mgr.transfers.join(', ') : 'None';
                            } else if (typeof mgr.transfers === 'object') {
                                rawTransfers = Object.values(mgr.transfers).join(', ');
                            } else {
                                rawTransfers = String(mgr.transfers);
                            }
                        } else if (mgr.transfersMade !== undefined && mgr.transfersMade !== null) {
                            const hitCost = mgr.transferCost || mgr.event_transfers_cost || mgr.hitCost || mgr.hits;
                            const hitStr = hitCost ? ` (-${hitCost} pts)` : '';
                            rawTransfers = `${mgr.transfersMade} made${hitStr}`;
                        } else if (mgr.event_transfers !== undefined) {
                            rawTransfers = `${mgr.event_transfers} made`;
                        }

                        let transfersText = formatTransfers(rawTransfers, mgr.hits);

                        html += `
                            <div class="${cardClass}" onclick="this.classList.toggle('expanded')">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <span style="font-weight: 700; font-size: 1rem; color: #ffffff;">${managerName}</span>
                                        ${hasActiveChip ? `<span class="chip-badge">${chipLabel} ACTIVE</span>` : ''}
                                        <div style="font-size: 0.76rem; color: var(--text-muted); margin-top: 2px;">${teamName}</div>
                                    </div>
                                    <span style="font-weight: 800; font-size: 1.15rem; color: var(--primary-color); display: flex; align-items: center; gap: 4px;">
                                        ${pointsDisplay} pts <span style="font-size: 0.7rem; opacity: 0.5;">▾</span>
                                    </span>
                                </div>
                                
                                <div class="card-dropdown">
                                    ${starName ? `<div style="margin-bottom: 5px; color: var(--text-muted);">⭐ <strong style="color: #fff;">Star:</strong> <span style="color: var(--primary-color); font-weight: 600;">${starName} (${starPts} pts)</span></div>` : ''}
                                    ${worstName ? `<div style="margin-bottom: 5px; color: var(--text-muted);">💩 <strong style="color: #fff;">Worst:</strong> <span style="color: var(--danger-color); font-weight: 600;">${worstName} (${worstPts} pts)</span></div>` : ''}
                                    <div style="margin-bottom: 4px; color: var(--text-muted);">🔄 <strong style="color: #fff;">Transfers:</strong> <span style="color: var(--accent-color); font-weight: 600;">${transfersText}</span></div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                });

                html += `</div>`;
            }

            // 2. Manager of the Month Carousel
            if (data.monthly && data.monthly.length > 0) {
                const activePeriods = data.monthly.filter(period => {
                    if (!period.scores || period.scores.length === 0) return false;
                    if (period.title.toLowerCase().includes('period period') || period.title.toLowerCase().includes('monthly side pot')) return false;
                    
                    const hasStarted = period.scores.some(s => Number(s.score) > 0);
                    if (!hasStarted) return false;

                    const isMalformed = period.scores.every(s => String(s.score) === s.name);
                    return !isMalformed;
                });

                if (activePeriods.length > 0) {
                    html += `<div class="section-title" style="margin-top: 24px;">Manager of the Month</div>`;
                    
                    html += `<div class="carousel-dots" id="carousel-dots">`;
                    activePeriods.forEach((_, index) => {
                        const isActive = index === activePeriods.length - 1 ? 'active' : '';
                        html += `<div class="dot ${isActive}" data-index="${index}"></div>`;
                    });
                    html += `</div>`;

                    html += `<div class="carousel-container" id="period-carousel">`;
                    
                    activePeriods.forEach(period => {
                        let cleanTitle = period.title.replace(/^Period\s+\d+\s*\(([^)]+)\)/i, '$1');

                        const formatPrize = (p) => {
                            if (!p) return '£0';
                            let str = String(p).trim();
                            return str.startsWith('£') ? str : '£' + str;
                        };

                        html += `
                            <div class="card carousel-card">
                                <h4 style="margin-top: 0; margin-bottom: 14px; color: var(--accent-color); font-size: 0.95rem; font-weight: 700; border-bottom: 1px solid var(--border-subtle); padding-bottom: 10px; letter-spacing: 0.3px;">${cleanTitle}</h4>
                                <ul style="list-style: none; padding: 0; margin: 0 0 14px 0;">
                                    ${period.scores.map((s, idx, arr) => {
                                        let scoreDisplay = String(s.score !== undefined && s.score !== null ? s.score : '0');
                                        if (idx === arr.length - 1 && !scoreDisplay.includes('💩')) {
                                            scoreDisplay += ' 💩';
                                        }
                                        const teamName = TEAM_NAMES[s.name] || '';
                                        return `
                                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border-subtle);">
                                                <div>
                                                    <div style="font-weight: 600; font-size: 0.9rem; color: #ffffff;">${s.name}</div>
                                                    ${teamName ? `<div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 1px;">${teamName}</div>` : ''}
                                                </div>
                                                <span style="font-weight: 700; font-size: 1rem; color: var(--primary-color);">${scoreDisplay}</span>
                                            </li>
                                        `;
                                    }).join('')}
                                </ul>
                                <div style="font-size: 0.82rem; color: var(--text-muted); background: rgba(0,0,0,0.25); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-subtle);">
                                    <div style="margin-bottom: 4px;">🏆 <strong style="color: #fff;">Winner:</strong> ${period.topScorer || 'TBD'} <span style="color: var(--gold-color); font-weight: 700;">(${formatPrize(period.winnerPrize)})</span></div>
                                    <div>🥈 <strong style="color: #fff;">Runner-up:</strong> ${period.runnerName || 'TBD'} <span style="color: var(--silver-color); font-weight: 700;">(${formatPrize(period.runnerPrize)})</span></div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                }
            }

            // 3. Overall Standings Table
            let topWeeksWonPlayer = null;
            let maxWeeksWon = -1;

            if (data.overall && data.overall.rows && data.overall.rows.length > 0) {
                const headers = data.overall.headers || [];
                const getCol = (name, fallback) => {
                    const idx = headers.findIndex(h => h && h.toString().toLowerCase().includes(name));
                    return idx !== -1 ? idx : fallback;
                };

                const playerIdx = getCol('player', getCol('name', 0));
                const pointsIdx = getCol('point', getCol('total', 1));
                const medalIdx = getCol('medal', 2);
                const weeksWonIdx = getCol('won', getCol('week', 3));
                const prizeIdx = getCol('prize', 5);

                const totalRows = data.overall.rows.length;

                const chipMap = {};
                const activeChipMap = {};

                const latestStandings = gwDataStore.length > 0 ? gwDataStore[gwDataStore.length - 1].standings : [];
                if (latestStandings) {
                    latestStandings.forEach(m => {
                        const key = (m.managerName || m.name || '').trim().toLowerCase();
                        chipMap[key] = m.remainingChips;
                        activeChipMap[key] = m.activeChip;
                    });
                }

                data.overall.rows.forEach(row => {
                    const pName = row[playerIdx];
                    const wWon = Number(row[weeksWonIdx]) || 0;
                    if (wWon > maxWeeksWon) {
                        maxWeeksWon = wWon;
                        topWeeksWonPlayer = { player: pName, val: wWon };
                    }
                });

                html += `
                    <div class="card" style="margin-top: 24px;">
                        <div class="section-title" style="margin-bottom: 16px;">Overall Standings</div>
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; table-layout: fixed; border-collapse: collapse; text-align: left;">
                                <thead>
                                    <tr style="border-bottom: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px;">
                                        <th style="width: 27%; padding: 0 2px 10px 2px; font-weight: 700;">Manager</th>
                                        <th style="width: 36%; padding: 0 2px 10px 2px; font-weight: 700; text-align: center;">Chips</th>
                                        <th style="width: 21%; padding: 0 2px 10px 2px; font-weight: 700; text-align: center;">Points</th>
                                        <th style="width: 16%; padding: 0 2px 10px 2px; font-weight: 700; text-align: right;">Prize</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.overall.rows.map((row, rIdx) => {
                                        const playerName = row[playerIdx] || '';
                                        const points = row[pointsIdx] !== undefined ? row[pointsIdx] : '';
                                        let medal = medalIdx !== -1 && row[medalIdx] !== undefined ? row[medalIdx] : '';
                                        if (!medal) {
                                            if (rIdx === 0) medal = '🥇';
                                            else if (rIdx === 1) medal = '🥈';
                                            else if (rIdx === 2) medal = '🥉';
                                        }
                                        if (rIdx === totalRows - 1 && !String(medal).includes('💩')) {
                                            medal += ' 💩';
                                        }
                                        const prizeVal = row[prizeIdx] !== undefined ? row[prizeIdx] : 0;
                                        const numericPrize = parseFloat(String(prizeVal).replace(/[^0-9.]/g, '')) || 0;
                                        const prizeStr = String(prizeVal).startsWith('£') ? prizeVal : '£' + prizeVal;
                                        
                                        let prizeColor = 'var(--gold-color)';
                                        if (rIdx === 1) {
                                            prizeColor = 'var(--silver-color)';
                                        }

                                        const prizeHtml = numericPrize > 0 
                                            ? `<span style="color: ${prizeColor}; font-weight: 700;">${prizeStr}</span>` 
                                            : `<span style="color: rgba(255,255,255,0.25); font-weight: 500;">£0</span>`;

                                        const pKey = String(playerName).trim().toLowerCase();
                                        const chipsHtml = renderChipsHtml(chipMap[pKey], activeChipMap[pKey]);

                                        return `
                                            <tr style="border-bottom: 1px solid var(--border-subtle);">
                                                <td style="width: 27%; padding: 12px 2px; font-weight: 600; color: #ffffff; font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                                    ${playerName}
                                                </td>
                                                <td style="width: 36%; padding: 12px 2px; text-align: center;">
                                                    ${chipsHtml}
                                                </td>
                                                <td style="width: 21%; padding: 12px 2px; font-weight: 800; color: var(--primary-color); font-size: 0.92rem; text-align: center; white-space: nowrap;">
                                                    ${points} ${medal}
                                                </td>
                                                <td style="width: 16%; padding: 12px 2px; font-size: 0.85rem; text-align: right; white-space: nowrap;">
                                                    ${prizeHtml}
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            // 4. Dynamic Calculation for Most Weeks Lost (Fallback)
            let computedWeeksLostPlayer = null;
            if (data.monthly && data.monthly.length > 0) {
                const bottomCounts = {};
                let maxLostCount = 0;

                data.monthly.forEach(period => {
                    if (period.scores && period.scores.length > 0) {
                        const validScores = period.scores.filter(s => s.score !== undefined && s.score !== null && !isNaN(Number(s.score)) && Number(s.score) > 0);
                        if (validScores.length > 0) {
                            let minScore = Math.min(...validScores.map(s => Number(s.score)));
                            validScores.forEach(s => {
                                if (Number(s.score) === minScore) {
                                    bottomCounts[s.name] = (bottomCounts[s.name] || 0) + 1;
                                    if (bottomCounts[s.name] > maxLostCount) {
                                        maxLostCount = bottomCounts[s.name];
                                    }
                                }
                            });
                        }
                    }
                });

                if (maxLostCount > 0) {
                    const tiedPlayers = Object.keys(bottomCounts).filter(p => bottomCounts[p] === maxLostCount);
                    computedWeeksLostPlayer = {
                        player: tiedPlayers.join(' / '),
                        val: maxLostCount
                    };
                }
            }

            // 5. Accolades Card
            if (data.accolades || topWeeksWonPlayer || computedWeeksLostPlayer) {
                const acc = data.accolades || {};

                const getAccObj = (keys) => {
                    for (let k of keys) {
                        if (acc[k] && (acc[k].player || acc[k].val !== undefined || acc[k].value !== undefined)) {
                            return acc[k];
                        }
                    }
                    return null;
                };

                const highestScore = getAccObj(['highestScore']);
                const lowestScore = getAccObj(['lowestScore']);
                const mostWeeksWon = getAccObj(['mostWeeksWon', 'weeksWon']) || topWeeksWonPlayer;
                const mostWeeksLost = getAccObj(['mostWeeksLost', 'mostWeeksLast', 'weeksLost']) || computedWeeksLostPlayer;
                const mostTransfers = getAccObj(['mostTransfers', 'highestTotalTransfers', 'transfers']);
                const highestTransferCost = getAccObj(['highestTotalHit', 'biggestHit', 'highestTransferCost']);

                const formatSub = (item) => {
                    if (!item || !item.player) return 'N/A';
                    return item.player + (item.gw ? ` (${item.gw})` : '');
                };

                const formatVal = (item, type) => {
                    if (!item) return '0';
                    const val = item.val !== undefined ? item.val : (item.value !== undefined ? item.value : item);
                    if (val === undefined || val === null || val === '') return '0';
                    if (type === 'cost') {
                        const num = Number(val);
                        return num > 0 ? '-' + num : String(num);
                    }
                    return String(val);
                };

                html += `
                    <div class="card" style="margin-top: 24px;">
                        <div class="section-title" style="margin-bottom: 16px;">Accolades</div>
                        <ul style="list-style: none; padding: 0; margin: 0;">
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.88rem; color: #ffffff;">🔥 Highest GW Score</div>
                                    <div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${formatSub(highestScore)}</div>
                                </div>
                                <span style="font-weight: 800; font-size: 1rem; color: var(--primary-color);">${formatVal(highestScore)}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.88rem; color: #ffffff;">🧊 Lowest GW Score</div>
                                    <div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${formatSub(lowestScore)}</div>
                                </div>
                                <span style="font-weight: 800; font-size: 1rem; color: var(--ice-blue);">${formatVal(lowestScore)}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.88rem; color: #ffffff;">🏆 Most Weeks Won</div>
                                    <div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${formatSub(mostWeeksWon)}</div>
                                </div>
                                <span style="font-weight: 800; font-size: 1rem; color: var(--gold-color);">${formatVal(mostWeeksWon)}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.88rem; color: #ffffff;">💩 Most Weeks Lost</div>
                                    <div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${formatSub(mostWeeksLost)}</div>
                                </div>
                                <span style="font-weight: 800; font-size: 1rem; color: var(--danger-color);">${formatVal(mostWeeksLost)}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.88rem; color: #ffffff;">🔄 Most Transfers</div>
                                    <div style="font-size: 0.74rem; color: var(--text-muted); font-weight: 500; margin-top: 2px;">${formatSub(mostTransfers)}</div>
                                </div>
                                <span style="font-weight: 800; font-size: 1rem; color: var(--accent-color);">${formatVal(mostTransfers)}</span>
                            </li>
                            <li style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0;">
                                <div>
                                    <div style="font-weight: 600; font-size: 0.88rem; color: #ffffff;">💸 Highest Transfer Cost</div>
                                    <div style="font-size: 0.74rem; color: var/--text-muted); font-weight: 500; margin-top: 2px;">${formatSub(highestTransferCost)}</div>
                                </div>
                                <span style="font-weight: 800; font-size: 1rem; color: var(--danger-color);">${formatVal(highestTransferCost, 'cost')}</span>
                            </li>
                        </ul>
                    </div>
                `;
            }

            appDiv.innerHTML = html;

            if (totalGwSlides > 0) {
                initGwCarousel();
            }

            const periodCarousel = document.getElementById('period-carousel');
            const dots = document.querySelectorAll('#carousel-dots .dot');

            if (periodCarousel && dots.length > 0) {
                periodCarousel.addEventListener('scroll', () => {
                    const index = Math.round(periodCarousel.scrollLeft / periodCarousel.clientWidth);
                    dots.forEach((dot, i) => {
                        dot.classList.toggle('active', i === index);
                    });
                });

                dots.forEach(dot => {
                    dot.addEventListener('click', (e) => {
                        const index = parseInt(e.target.getAttribute('data-index'));
                        periodCarousel.scrollTo({
                            left: index * periodCarousel.clientWidth,
                            behavior: 'smooth'
                        });
                    });
                });
            }
        }

        function initGwCarousel() {
            const track = document.getElementById('gw-carousel-track');
            if (!track) return;

            currentGwSlideIdx = totalGwSlides - 1;
            scrollGwCarousel(false);

            track.addEventListener('scroll', () => {
                const slides = Array.from(track.querySelectorAll('.carousel-card'));
                if (slides.length === 0) return;

                const firstOffset = slides[0].offsetLeft;
                let index = 0;
                let closestDistance = Infinity;

                slides.forEach((slide, slideIndex) => {
                    const slidePosition = slide.offsetLeft - firstOffset;
                    const distance = Math.abs(track.scrollLeft - slidePosition);
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        index = slideIndex;
                    }
                });

                if (index !== currentGwSlideIdx && index >= 0 && index < totalGwSlides) {
                    currentGwSlideIdx = index;
                    updateGwCarouselHeader();
                }
            });
        }

        function updateGwCarouselHeader() {
            const prevBtn = document.getElementById('prevGwBtn');
            const nextBtn = document.getElementById('nextGwBtn');
            const titleEl = document.getElementById('gwSlideTitle');

            if (prevBtn) prevBtn.disabled = (currentGwSlideIdx === 0);
            if (nextBtn) nextBtn.disabled = (currentGwSlideIdx === totalGwSlides - 1);

            if (titleEl && gwDataStore[currentGwSlideIdx]) {
                const gwInfo = gwDataStore[currentGwSlideIdx];
                const gwNum = gwInfo.gameweek !== undefined ? gwInfo.gameweek : (gwInfo.gw !== undefined ? gwInfo.gw : (currentGwSlideIdx + 1));
                const badge = gwInfo.isLive 
                    ? `<span class="badge-live">LIVE</span>` 
                    : `<span class="badge-final">FINAL</span>`;
                titleEl.innerHTML = `GW ${gwNum} ${badge}`;
            }
        }

        function scrollGwCarousel(smooth = true) {
            const track = document.getElementById('gw-carousel-track');
            const slide = document.getElementById(`gw-slide-${currentGwSlideIdx}`);
            if (track && slide) {
                const firstSlide = track.querySelector('.carousel-card');
                const firstOffset = firstSlide ? firstSlide.offsetLeft : 0;
                track.scrollTo({
                    left: slide.offsetLeft - firstOffset,
                    behavior: smooth ? 'smooth' : 'auto'
                });
            }
            updateGwCarouselHeader();
        }

        function moveGwSlide(direction) {
            const nextIdx = currentGwSlideIdx + direction;
            if (nextIdx >= 0 && nextIdx < totalGwSlides) {
                currentGwSlideIdx = nextIdx;
                scrollGwCarousel(true);
            }
        }

        window.addEventListener('DOMContentLoaded', loadTrackerData);
    </script>
</body>
</html>
